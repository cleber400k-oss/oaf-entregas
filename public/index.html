function saveMandatoryPassword(){const p=el('firstPass').value;if(p.length<4)return toast('Use pelo menos 4 caracteres.');const u=db.users.find(x=>x.id===session.id);u.password=p;u.mustChangePassword=false;session={...u};audit('Senha alterada no primeiro acesso');save();closeModal();render()}

/* ======================== ADMINISTRAÇÃO ======================== */
const ADMIN_ITEMS=[
  ['home','Início',null],['pending','Pendências',null],['monitor','Monitoramento','monitor_view'],['deliveries','Entregas','deliveries_view'],['couriers','Entregadores','couriers_view'],['merchants','Comerciantes','merchants_view'],['finance','Financeiro','finance_view'],['users','Usuários','users_view'],['complaints','Reclamações','complaints_view'],['occurrences','Ocorrências','occurrences_view'],['addresses','Endereços','addresses_view'],['audit','Auditoria','audit_view']
];
function adminTitle(){return Object.fromEntries(ADMIN_ITEMS.map(([k,n])=>[k,n]))[currentAdminTab]||'Administração'}
function renderAdminContent(){const map={home:adminHome,pending:adminPending,monitor:adminMonitor,deliveries:adminDeliveries,couriers:adminCouriers,merchants:adminMerchants,finance:adminFinance,users:adminUsers,complaints:adminComplaints,occurrences:adminOccurrences,addresses:adminAddresses,audit:adminAudit};map[currentAdminTab]?.()}
function openChargeDetail(id){const c=db.charges.find(x=>x.id===id),ds=(c.deliveryIds||[]).map(delivery).filter(Boolean);showModal(`Cobrança ${esc(id)}`,`<p><strong>${esc(merchant(c.merchantId)?.name||'')}</strong></p><div class="kpi-row"><div class="kpi-mini"><strong>${c.count}</strong><span>entregas</span></div><div class="kpi-mini"><strong>${money(c.total)}</strong><span>total</span></div><div class="kpi-mini"><strong>${esc(c.status)}</strong><span>status</span></div></div><div class="section-title"><h3>Entregas vinculadas</h3></div>${ds.length?ds.map(d=>`<div class="delivery-box"><div class="head"><div><h4>${esc(d.id)} · ${esc(d.recipient)}</h4><p>${fmtDateTime(d.finishedAt)} · ${esc(d.street)}, ${esc(d.number)}</p></div><strong>${money(d.price)}</strong></div></div>`).join(''):'<p class="muted">Os lançamentos antigos de demonstração não possuem IDs individuais vinculados.</p>'}${c.adjustments?.length?`<div class="section-title"><h3>Ajustes</h3></div>${c.adjustments.map(a=>`<p class="small"><strong>${fmtDateTime(a.at)}</strong> · ${money(a.old)} → ${money(a.new)} · ${esc(a.reason)} · ${esc(a.by)}</p>`).join('')}`:''}`,`<button class="btn ghost" onclick="closeModal()">Fechar</button>`)}
function adminUsers(){if(!guardPerm('users_view')&&!session.main)return;const admins=db.users.filter(u=>u.role==='admin');el('adminContent').innerHTML=`<div class="section-title"><h3>Administradores</h3>${session.main||hasPerm('users_create_merchant')||hasPerm('users_create_courier')?'<button class="btn primary" onclick="openNewUser()">Novo cadastro</button>':''}</div><div class="table-wrap"><table class="table mobile-stack"><thead><tr><th>Nome</th><th>Nível</th><th>Permissões</th><th>Status</th><th></th></tr></thead><tbody>${admins.map(u=>`<tr><td data-label="Nome">${esc(u.name)}</td><td data-label="Nível">${u.main?'Principal · modo Deus':'Secundário · anjo'}</td><td data-label="Permissões">${u.main?'Todas':esc((u.permissions||[]).map(p=>PERMISSION_LABELS[p]||p).join(', '))}</td><td data-label="Status"><span class="status ${u.active?'green':'red'}">${u.active?'Ativo':'Desativado'}</span></td><td data-label="Ações">${session.main&&!u.main?`<button class="btn sm ghost" onclick="editSecondaryAdmin('${u.id}')">Editar permissões</button>`:'—'}</td></tr>`).join('')}</tbody></table></div><div class="section-title"><h3>Pedidos de saída dos entregadores</h3></div>${db.logoutRequests.filter(r=>r.status==='Pendente').map(r=>`<div class="alert"><div class="icon">↪</div><div><strong>${esc(courier(r.courierId)?.nick||'Entregador')} quer sair</strong><p>${esc(r.reason)} · solicitado ${fmtDateTime(r.createdAt)}</p></div><div class="alert-actions"><button class="btn sm success" onclick="resolveLogout('${r.id}','Aprovado')">Aprovar</button><button class="btn sm danger" onclick="resolveLogout('${r.id}','Negado')">Negar</button></div></div>`).join('')||emptyState('Nenhuma solicitação','Não há pedidos de saída pendentes.')}`}
function adminComplaints(){if(!guardPerm('complaints_view')&&!session.main)return;el('adminContent').innerHTML=db.complaints.length?`<div class="table-wrap"><table class="table mobile-stack"><thead><tr><th>ID</th><th>Pedido</th><th>Comércio</th><th>Motivo</th><th>Status</th><th>Atualização</th><th></th></tr></thead><tbody>${db.complaints.map(r=>`<tr><td data-label="ID">${esc(r.id)}</td><td data-label="Pedido">${esc(r.deliveryId)}</td><td data-label="Comércio">${esc(merchant(r.merchantId)?.name||'—')}</td><td data-label="Motivo">${esc(r.reason)}</td><td data-label="Status"><span class="status ${statusColor(r.status)}">${esc(r.status)}</span></td><td data-label="Atualização">${fmtDateTime(r.updatedAt||r.createdAt)}</td><td data-label="Ação"><button class="btn sm ghost" onclick="openComplaint('${r.id}')">Abrir</button></td></tr>`).join('')}</tbody></table></div>`:emptyState('Nenhuma reclamação','As reclamações abertas pelos comerciantes aparecerão aqui.')}
function adminOccurrences(){if(!guardPerm('occurrences_view')&&!session.main)return;el('adminContent').innerHTML=db.occurrences.length?`<div class="table-wrap"><table class="table mobile-stack"><thead><tr><th>ID</th><th>Severidade</th><th>Tipo</th><th>Título</th><th>Pedido</th><th>Status</th><th></th></tr></thead><tbody>${db.occurrences.map(o=>`<tr><td data-label="ID">${esc(o.id)}</td><td data-label="Severidade"><span class="status ${o.severity==='Crítica'?'red':'amber'}">${esc(o.severity)}</span></td><td data-label="Tipo">${esc(o.type)}</td><td data-label="Título">${esc(o.title)}</td><td data-label="Pedido">${esc(o.deliveryId||'—')}</td><td data-label="Status"><span class="status ${o.status==='Encerrada'?'green':'amber'}">${esc(o.status)}</span></td><td data-label="Ação"><button class="btn sm ghost" onclick="openOccurrence('${o.id}')">Abrir</button></td></tr>`).join('')}</tbody></table></div>`:emptyState('Nenhuma ocorrência','Problemas operacionais aparecerão aqui sem virarem reclamação automaticamente.')}
function adminAddresses(){if(!guardPerm('addresses_view')&&!session.main)return;const pending=db.addressReviews.filter(a=>a.status==='Pendente');el('adminContent').innerHTML=`<div class="section-title"><h3>Pendentes de revisão</h3><span class="muted">Correções enviadas pelos entregadores</span></div>${pending.length?pending.map(a=>`<div class="card" style="margin-bottom:10px"><h3>${esc(a.old)} → ${esc(a.suggested)}</h3><p class="muted">${esc(a.district)} · ${esc(a.reference)} · enviado por ${esc(courier(a.courierId)?.nick||'—')}</p><div style="display:flex;gap:8px;flex-wrap:wrap">${session.main||hasPerm('addresses_manage')?`<button class="btn success" onclick="resolveAddress('${a.id}','Aprovado')">Aprovar</button><button class="btn ghost" onclick="editAddressReview('${a.id}')">Editar e aprovar</button><button class="btn danger" onclick="resolveAddress('${a.id}','Rejeitado')">Rejeitar</button>`:''}</div></div>`).join(''):emptyState('Nenhuma correção pendente','A base de ruas está sem revisões aguardando aprovação.')}<div class="section-title"><h3>Base oficial</h3><span class="muted">${db.addressDatabase.length} ruas cadastradas</span></div><div class="table-wrap"><table class="table mobile-stack"><thead><tr><th>Rua</th><th>Apelidos</th><th>Bairro</th><th>Referências</th><th>Confirmações</th><th>Última revisão</th></tr></thead><tbody>${db.addressDatabase.map(a=>`<tr><td data-label="Rua"><strong>${esc(a.street)}</strong></td><td data-label="Apelidos">${esc((a.aliases||[]).join(', ')||'—')}</td><td data-label="Bairro">${esc(a.district||'—')}</td><td data-label="Referências">${esc((a.references||[]).join(', ')||'—')}</td><td data-label="Confirmações">${a.confirmations||0}</td><td data-label="Revisão">${fmtDate(a.lastReview)}</td></tr>`).join('')}</tbody></table></div>`}
function adminAudit(){if(!session.main&&!guardPerm('audit_view'))return;const q=normalizeText(adminAuditSearch);const list=db.audit.filter(a=>!q||normalizeText([a.action,a.by,JSON.stringify(a.details||{})].join(' ')).includes(q)).slice(0,300);el('adminContent').innerHTML=`<div class="toolbar"><div class="searchbar"><input id="auditSearch" value="${attr(adminAuditSearch)}" placeholder="Buscar usuário ou ação" oninput="adminAuditSearch=this.value;adminAudit()"></div></div>${list.length?`<div class="table-wrap"><table class="table mobile-stack"><thead><tr><th>Data/hora</th><th>Usuário</th><th>Ação</th></tr></thead><tbody>${list.map(a=>`<tr><td data-label="Data/hora">${fmtDateTime(a.at)}</td><td data-label="Usuário">${esc(a.by)}</td><td data-label="Ação">${esc(a.action)}</td></tr>`).join('')}</tbody></table></div>`:emptyState('Auditoria vazia','As ações importantes do sistema aparecerão aqui.')}`}

function openCourierDetail(id){const c=courier(id),active=db.deliveries.find(d=>d.courierId===id&&isActive(d)),occ=db.occurrences.filter(o=>o.courierId===id),msgs=db.internalMessages.filter(m=>m.courierId===id).slice(-8).reverse();showModal(`${duckSVG(c)} ${esc(c.nick)}`,`<div class="profile-head">${duckSVG(c)}<div><h2>${esc(c.name)}</h2><div class="muted">${esc(displayPhone(c.phone))}</div></div></div><div class="kpi-row" style="margin-top:14px"><div class="kpi-mini"><strong>#${c.queue||'—'}</strong><span>ficha</span></div><div class="kpi-mini"><strong>${c.deliveriesToday}</strong><span>entregas hoje</span></div><div class="kpi-mini"><strong>${occ.filter(o=>o.status!=='Encerrada').length}</strong><span>ocorrências</span></div></div><div class="grid two-col" style="margin-top:14px"><div><p><strong>Status:</strong> ${esc(c.adminBlocked?'Bloqueado':c.status)}</p><p><strong>GPS:</strong> ${c.gps?'Ativo':'Desligado'}</p><p><strong>Conexão:</strong> ${c.connection?'Normal':'Perdida'}</p><p><strong>Última atualização:</strong> ${fmtDateTime(c.lastPing)}</p><p><strong>Entrega atual:</strong> ${active?esc(active.id+' · '+active.street+', '+active.number):'Nenhuma'}</p>${DEMO_MODE?`<div class="support-row"><button class="btn sm ghost" onclick="simulateGPS('${id}')">Alternar GPS</button><button class="btn sm ghost" onclick="simulateConnection('${id}')">Alternar conexão</button></div>`:''}</div><div>${session.main||hasPerm('monitor_message')?`<div class="field"><label>Mensagem interna</label><select id="msgLevel"><option>Informação</option><option>Importante</option><option>Urgente</option></select><textarea id="internalMsg" rows="4" placeholder="Digite um aviso para o entregador"></textarea></div><button class="btn warn full" onclick="sendInternal('${id}')">Enviar alerta no app</button>`:''}<button class="btn ghost full" style="margin-top:8px" onclick="whatsapp('${attr(c.phone)}','Olá ${attr(c.nick)}, aqui é da administração.')">WhatsApp</button><button class="btn ghost full" style="margin-top:8px" onclick="callPhone('${attr(c.phone)}')">Ligar</button></div></div>${session.main?`<div class="section-title"><h3>Controle do modo Deus</h3></div><div class="support-row"><button class="btn ${c.adminBlocked?'success':'danger'}" onclick="toggleCourierBlock('${id}')">${c.adminBlocked?'Desbloquear':'Bloquear'} entregador</button><button class="btn ghost" onclick="resetUserPassword('${userByCourier(id)?.id||''}')">Redefinir senha</button></div>`:''}<div class="section-title"><h3>Mensagens recentes</h3></div>${msgs.length?msgs.map(m=>`<div class="delivery-box"><strong>${esc(m.level||'Informação')} · ${fmtDateTime(m.at)}</strong><p>${esc(m.msg)}</p><span class="status ${m.read?'green':'amber'}">${m.read?`Lida ${fmtTime(m.readAt)}`:'Não lida'}</span></div>`).join(''):'<p class="muted">Nenhuma mensagem recente.</p>'}`,`<button class="btn ghost" onclick="closeModal()">Fechar</button>`,true)}
function sendInternal(id){const msg=el('internalMsg').value.trim(),level=el('msgLevel').value;if(!msg)return toast('Digite a mensagem.');db.internalMessages.push({id:'M-'+Date.now(),courierId:id,msg,level,at:Date.now(),read:false,requiresAck:level!=='Informação',readAt:null});audit(`Mensagem ${level.toLowerCase()} enviada para ${courier(id).nick}`);save();closeModal();toast('Mensagem enviada ao aplicativo do entregador.','success')}
function simulateGPS(id){const c=courier(id);c.gps=!c.gps;c.lastPing=Date.now();audit(`GPS simulado ${c.gps?'ativado':'desativado'} para ${c.nick}`);if(c.gps)engineQueue('GPS restaurado');save();closeModal();renderAdmin();toast(`GPS ${c.gps?'ativado':'desativado'} no modo demo.`)}
function simulateConnection(id){const c=courier(id);c.connection=!c.connection;c.lastPing=Date.now();c.connectionLostAt=c.connection?null:Date.now();if(!c.connection)createOccurrence({type:'Conexão',severity:db.deliveries.some(d=>d.courierId===id&&isActive(d))?'Crítica':'Atenção',courierId:id,deliveryId:db.deliveries.find(d=>d.courierId===id&&isActive(d))?.id||null,title:`Conexão perdida — ${c.nick}`,description:'O aplicativo deixou de enviar atualizações.'});else engineQueue('conexão restaurada');audit(`Conexão simulada ${c.connection?'restaurada':'perdida'} para ${c.nick}`);save();closeModal();renderAdmin();toast(`Conexão ${c.connection?'restaurada':'interrompida'} no modo demo.`)}
function toggleCourierBlock(id){if(!session.main)return;const c=courier(id);confirmAction(c.adminBlocked?'Desbloquear entregador':'Bloquear entregador',`${c.adminBlocked?'Desbloquear':'Bloquear'} ${c.nick}?`,'Confirmar',reason=>{c.adminBlocked=!c.adminBlocked;c.adminBlockReason=c.adminBlocked?reason:'';if(c.adminBlocked){c.online=false;c.status='Bloqueado'}else c.status='Offline';audit(`${c.adminBlocked?'Bloqueio':'Desbloqueio'} administrativo do entregador ${c.nick}`,{reason});normalizeOnlineQueue();save();closeModal();closeModal();renderAdmin();toast('Situação do entregador atualizada.','success')},!c.adminBlocked,!c.adminBlocked)}
function openMerchantDetail(id){const m=merchant(id),fin=merchantFinancialStatus(id),active=db.deliveries.filter(d=>d.merchantId===id&&isActive(d)),month=db.deliveries.filter(d=>d.merchantId===id&&new Date(d.createdAt).getMonth()===new Date().getMonth()).length,charges=db.charges.filter(c=>c.merchantId===id),compl=db.complaints.filter(r=>r.merchantId===id);showModal(esc(m.name),`<div class="kpi-row"><div class="kpi-mini"><strong>${active.length}</strong><span>pedidos ativos</span></div><div class="kpi-mini"><strong>${month}</strong><span>pedidos no mês</span></div><div class="kpi-mini"><strong>${money(charges.filter(c=>c.status!=='Pago').reduce((a,c)=>a+c.total,0))}</strong><span>em aberto</span></div></div><div class="grid two-col" style="margin-top:14px"><div><p><strong>Responsável:</strong> ${esc(m.responsible)}</p><p><strong>Telefone:</strong> ${esc(displayPhone(m.phone))}</p><p><strong>Endereço:</strong> ${esc(m.address)}</p><p><strong>Taxa:</strong> ${money(m.fee)} por entrega</p><p><strong>Cobrança:</strong> ${esc(m.billing)} · ${esc(m.billingDay)}</p><p><strong>Situação:</strong> ${m.adminBlocked?'Suspenso pela administração':fin==='overdue'?'Inadimplente':fin==='dueSoon'?'Vence em breve':'Em dia'}</p></div><div><p><strong>Reclamações:</strong> ${compl.length}</p><p><strong>Entregas totais:</strong> ${db.deliveries.filter(d=>d.merchantId===id).length}</p>${session.main?`<button class="btn ghost full" onclick="editMerchant('${id}')">Editar cadastro</button><button class="btn ${m.adminBlocked?'success':'danger'} full" style="margin-top:8px" onclick="toggleMerchantBlock('${id}')">${m.adminBlocked?'Desbloquear':'Suspender'} conta</button><button class="btn ghost full" style="margin-top:8px" onclick="resetUserPassword('${userByMerchant(id)?.id||''}')">Redefinir senha</button>`:''}</div></div>`,`<button class="btn ghost" onclick="closeModal()">Fechar</button>`)}
function editMerchant(id){const m=merchant(id);showModal(`Editar ${esc(m.name)}`,`<div class="form-grid"><div class="field"><label>Nome</label><input id="emName" value="${attr(m.name)}"></div><div class="field"><label>Responsável</label><input id="emResp" value="${attr(m.responsible)}"></div><div class="field"><label>Telefone</label><input id="emPhone" value="${attr(m.phone)}"></div><div class="field"><label>Endereço</label><input id="emAddress" value="${attr(m.address)}"></div><div class="field"><label>Valor por entrega</label><input id="emFee" type="number" min="0" step="0.01" value="${m.fee}"></div><div class="field"><label>Periodicidade</label><select id="emBilling"><option ${m.billing==='Semanal'?'selected':''}>Semanal</option><option ${m.billing==='Quinzenal'?'selected':''}>Quinzenal</option><option ${m.billing==='Mensal'?'selected':''}>Mensal</option></select></div><div class="field wide"><label>Dia da cobrança</label><input id="emDay" value="${attr(m.billingDay)}"></div></div><p class="muted small">Mudança da taxa vale somente para novas entregas. Entregas antigas mantêm o valor registrado.</p>`,`<button class="btn primary" onclick="saveMerchantEdit('${id}')">Salvar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button>`)}
function saveMerchantEdit(id){const m=merchant(id),oldFee=m.fee,newFee=Number(el('emFee').value);m.name=el('emName').value.trim();m.responsible=el('emResp').value.trim();m.phone=phoneDigits(el('emPhone').value);m.address=el('emAddress').value.trim();m.fee=Number.isFinite(newFee)&&newFee>=0?newFee:m.fee;m.billing=el('emBilling').value;m.billingDay=el('emDay').value.trim();if(oldFee!==m.fee)audit(`Taxa de ${m.name} alterada`,{oldFee,newFee:m.fee});audit(`Cadastro de comerciante atualizado: ${m.name}`);save();closeModal();renderAdmin();toast('Comerciante atualizado.','success')}
function toggleMerchantBlock(id){if(!session.main)return;const m=merchant(id);confirmAction(m.adminBlocked?'Desbloquear conta':'Suspender conta',`${m.adminBlocked?'Desbloquear':'Suspender'} ${m.name}?`,'Confirmar',reason=>{m.adminBlocked=!m.adminBlocked;m.adminBlockReason=m.adminBlocked?reason:'';audit(`${m.adminBlocked?'Bloqueio':'Desbloqueio'} administrativo de ${m.name}`,{reason});save();closeModal();renderAdmin();toast('Situação administrativa atualizada.','success')},!m.adminBlocked,!m.adminBlocked)}
function resetUserPassword(uid){if(!session.main)return;const u=db.users.find(x=>x.id===uid);if(!u)return;confirmAction('Redefinir senha',`Redefinir a senha de ${u.name} para uma senha temporária?`,'Redefinir',()=>{u.password='1234';u.mustChangePassword=true;audit(`Senha redefinida para ${u.name}`);save();closeModal();toast('Senha temporária definida como 1234. O usuário trocará no próximo acesso.','success')})}
function openDelivery(id){const d=delivery(id),m=merchant(d.merchantId),c=d.courierId?courier(d.courierId):null,occ=db.occurrences.filter(o=>o.deliveryId===id),hist=[...d.history].sort((a,b)=>a[1]-b[1]);const timeline=hist.map((h,i)=>{const next=hist[i+1]?.[1],dur=next?Math.max(0,Math.round((next-h[1])/60000)):null;return`<div class="timeline-row"><div class="timeline-time">${fmtTime(h[1])}</div><div class="timeline-dot"></div><div class="timeline-text"><strong>${esc(h[0])}</strong>${dur!==null?`<div class="duration">${dur} min até a próxima etapa</div>`:''}</div></div>`}).join('');showModal(`Entrega ${esc(id)}`,`<div class="grid two-col"><div><p><strong>Comércio</strong><br>${esc(m?.name||'—')}</p><p><strong>Entregador</strong><br>${esc(c?.nick||'Aguardando')}</p><p><strong>Destino</strong><br>${esc(d.recipient)} · ${esc(d.street)}, ${esc(d.number)} · ${esc(d.district)}<br>${esc(d.reference||'')}</p><p><strong>Status</strong><br><span class="status ${statusColor(d.status)}">${esc(d.status)}</span></p><p><strong>Valor</strong><br>${money(d.price)}</p>${d.receivedBy?`<p><strong>Quem recebeu</strong><br>${esc(d.receivedBy)}</p>`:''}</div><div><h3>Histórico cronológico</h3><div class="timeline">${timeline}</div></div></div>${occ.length?`<div class="section-title"><h3>Ocorrências relacionadas</h3></div>${occ.map(o=>`<div class="alert ${o.severity==='Crítica'?'critical':''}"><div class="icon">O</div><div><strong>${esc(o.title)}</strong><p>${esc(o.description)}</p></div></div>`).join('')}`:''}`,`${session.main&&['Aguardando entregador','Atribuída','Indo buscar','Cheguei ao comércio'].includes(d.status)?`<button class="btn danger" onclick="adminCancelDelivery('${id}')">Cancelamento excepcional</button>`:''}<button class="btn ghost" onclick="closeModal()">Fechar</button>`,true)}
function openComplaint(id){const r=db.complaints.find(x=>x.id===id);showModal(`Reclamação ${esc(r.id)}`,`<p><strong>Pedido:</strong> ${esc(r.deliveryId)}</p><p><strong>Motivo:</strong> ${esc(r.reason)}</p><p>${esc(r.description)}</p><div class="field"><label>Status</label><select id="complaintStatus" ${session.main||hasPerm('complaints_manage')?'':'disabled'}><option ${r.status==='Aberta'?'selected':''}>Aberta</option><option ${r.status==='Em análise'?'selected':''}>Em análise</option><option ${r.status==='Resolvida'?'selected':''}>Resolvida</option></select></div><div class="field"><label>Resposta para o comerciante</label><textarea id="complaintResponse" ${session.main||hasPerm('complaints_manage')?'':'disabled'}>${esc(r.response||'')}</textarea></div><div class="field"><label>Observação interna</label><textarea id="complaintInternal" ${session.main||hasPerm('complaints_manage')?'':'disabled'}>${esc(r.internalNote||'')}</textarea></div>`,`${session.main||hasPerm('complaints_manage')?`<button class="btn primary" onclick="saveComplaint('${id}')">Salvar</button>`:''}<button class="btn ghost" onclick="closeModal()">Fechar</button>`)}
function saveComplaint(id){const r=db.complaints.find(x=>x.id===id),old=r.status;r.status=el('complaintStatus').value;r.response=el('complaintResponse').value.trim();r.internalNote=el('complaintInternal').value.trim();r.assignedAdmin=session.name;r.updatedAt=Date.now();if(r.status==='Resolvida'&&old!=='Resolvida')r.resolvedAt=Date.now();audit(`Reclamação atualizada: ${id}`,{status:r.status});save();closeModal();renderAdmin();toast('Reclamação atualizada.','success')}
function openOccurrence(id){const o=db.occurrences.find(x=>x.id===id);showModal(`Ocorrência ${esc(o.id)}`,`<p><strong>${esc(o.title)}</strong></p><p>${esc(o.description)}</p><p class="muted">${esc(o.type)} · ${esc(o.severity)} · ${fmtDateTime(o.createdAt)}</p><div class="field"><label>Status</label><select id="occStatus" ${session.main||hasPerm('occurrences_manage')?'':'disabled'}><option ${o.status==='Nova'?'selected':''}>Nova</option><option ${o.status==='Em acompanhamento'?'selected':''}>Em acompanhamento</option><option ${o.status==='Encerrada'?'selected':''}>Encerrada</option></select></div><div class="field"><label>Conclusão</label><textarea id="occResolution" ${session.main||hasPerm('occurrences_manage')?'':'disabled'}>${esc(o.resolution||'')}</textarea></div>`,`${session.main||hasPerm('occurrences_manage')?`<button class="btn primary" onclick="saveOccurrence('${id}')">Salvar</button>`:''}<button class="btn ghost" onclick="closeModal()">Fechar</button>`)}

function applyAddressReview(a){const exact=db.addressDatabase.find(x=>normalizeText(x.street)===normalizeText(a.suggested));if(exact){exact.confirmations=(exact.confirmations||0)+1;exact.lastReview=Date.now();if(a.old&&normalizeText(a.old)!==normalizeText(a.suggested)&&!(exact.aliases||[]).some(x=>normalizeText(x)===normalizeText(a.old)))exact.aliases=[...(exact.aliases||[]),a.old];if(a.reference&&!(exact.references||[]).some(x=>normalizeText(x)===normalizeText(a.reference)))exact.references=[...(exact.references||[]),a.reference]}else db.addressDatabase.push({id:'AD-'+Date.now(),street:a.suggested,aliases:a.old&&normalizeText(a.old)!==normalizeText(a.suggested)?[a.old]:[],district:a.district||'',references:a.reference?[a.reference]:[],lat:null,lng:null,status:'Confirmado',confirmations:1,lastReview:Date.now()})}

function openNewUser(){const canAdmin=session.main,canMerchant=session.main||hasPerm('users_create_merchant'),canCourier=session.main||hasPerm('users_create_courier');showModal('Novo cadastro',`<div class="field"><label>Tipo de usuário</label><select id="newRole" onchange="newUserFields()">${canMerchant?'<option value="merchant">Comerciante</option>':''}${canCourier?'<option value="courier">Entregador</option>':''}${canAdmin?'<option value="admin">Administrador secundário</option>':''}</select></div><div id="newUserDynamic"></div>`,`<button class="btn primary" onclick="saveNewUser()">Criar cadastro</button><button class="btn ghost" onclick="closeModal()">Cancelar</button>`,true);newUserFields()}
function permGroups(current=[]){const groups={Monitoramento:['monitor_view','monitor_message'],Entregas:['deliveries_view','deliveries_manage'],Pessoas:['couriers_view','merchants_view'],Financeiro:['finance_view','finance_confirm','finance_adjust'],Atendimento:['complaints_view','complaints_manage','occurrences_view','occurrences_manage'],Endereços:['addresses_view','addresses_manage'],Usuários:['users_view','users_create_merchant','users_create_courier'],Auditoria:['audit_view']};return `<div class="permission-grid">${Object.entries(groups).map(([g,ps])=>`<div class="perm-group"><strong>${esc(g)}</strong>${ps.map(p=>`<label><input type="checkbox" class="perm" value="${p}" ${current.includes(p)?'checked':''}> ${esc(PERMISSION_LABELS[p])}</label>`).join('')}</div>`).join('')}</div>`}

function saveNewUser(){const role=el('newRole').value,name=el('nName').value.trim(),login=el('nLogin').value.trim(),pass=el('nPass').value.trim();if(!name||!login||pass.length<4)return toast('Preencha nome, login e senha com pelo menos 4 caracteres.');if(db.users.some(u=>normalizeText(u.login)===normalizeText(login)))return toast('Esse login já existe.');const uid='u'+Date.now();if(role==='merchant'){if(!session.main&&!hasPerm('users_create_merchant'))return;const mid='m'+Date.now(),fee=Number(el('nFee').value);db.merchants.push({id:mid,name,responsible:el('nResp').value.trim(),phone:phoneDigits(el('nPhone').value),address:el('nAddress').value.trim(),district:'',reference:'',fee:Number.isFinite(fee)&&fee>=0?fee:8,billing:el('nBilling').value,billingDay:el('nDay').value.trim(),adminBlocked:false,adminBlockReason:'',active:true});db.users.push({id:uid,login,password:pass,role:'merchant',name,merchantId:mid,active:true,mustChangePassword:true})}else if(role==='courier'){if(!session.main&&!hasPerm('users_create_courier'))return;const cid='c'+Date.now();db.couriers.push({id:cid,name,nick:el('nNick').value.trim()||name,phone:phoneDigits(el('nPhone').value),online:false,queue:0,status:'Offline',gps:true,connection:true,connectionLostAt:null,deliveriesToday:0,x:50,y:50,avatar:'duck',adminBlocked:false,adminBlockReason:'',lastPing:Date.now()});db.users.push({id:uid,login,password:pass,role:'courier',name,courierId:cid,active:true,mustChangePassword:true})}else{if(!session.main)return;const perms=[...document.querySelectorAll('.perm:checked')].map(x=>x.value);db.users.push({id:uid,login,password:pass,role:'admin',name,main:false,permissions:perms,active:true,mustChangePassword:true})}audit(`Novo cadastro criado: ${name}`,{role});save();closeModal();renderAdmin();toast('Cadastro criado.','success')}
function editSecondaryAdmin(uid){if(!session.main)return;const u=db.users.find(x=>x.id===uid&&!x.main);showModal(`Permissões de ${esc(u.name)}`,permGroups(u.permissions||[]),`<button class="btn primary" onclick="saveSecondaryAdminPerms('${uid}')">Salvar permissões</button><button class="btn ghost" onclick="closeModal()">Cancelar</button>`,true)}

function openCorrection(id){const d=delivery(id);if(!d||d.merchantId!==session.merchantId||!isActive(d))return;showModal(`Corrigir ${esc(id)}`,`<div class="field"><label>Rua</label><input id="corrStreet" list="corrStreetList" value="${attr(d.street)}"><datalist id="corrStreetList">${streetDatalist()}</datalist></div><div class="field"><label>Número</label><input id="corrNumber" value="${attr(d.number)}"></div><div class="field"><label>Ponto de referência</label><input id="corrRef" value="${attr(d.reference||'')}"></div><div class="field"><label>Motivo da correção</label><textarea id="corrReason"></textarea></div>`,`<button class="btn primary" onclick="saveCorrection('${id}')">Salvar correção</button><button class="btn ghost" onclick="closeModal()">Cancelar</button>`)}
function saveCorrection(id){const d=delivery(id),reason=el('corrReason').value.trim();if(!reason)return toast('Informe o motivo.');const old={street:d.street,number:d.number,reference:d.reference},nw={street:el('corrStreet').value.trim(),number:el('corrNumber').value.trim(),reference:el('corrRef').value.trim()};if(!nw.street||!nw.number)return toast('Rua e número são obrigatórios.');d.street=nw.street;d.number=nw.number;d.reference=nw.reference;d.history.push([`Dados corrigidos pelo comerciante: ${old.street}, ${old.number} → ${nw.street}, ${nw.number}`,Date.now()]);if(d.courierId){db.internalMessages.push({id:'M-'+Date.now(),courierId:d.courierId,msg:`DADOS ALTERADOS na entrega ${d.id}: ${old.street}, ${old.number} → ${nw.street}, ${nw.number}. Motivo: ${reason}`,level:'Urgente',at:Date.now(),read:false,requiresAck:true,readAt:null,deliveryId:d.id})}createOccurrence({type:'Alteração de pedido',severity:'Crítica',deliveryId:d.id,courierId:d.courierId,merchantId:d.merchantId,title:`Dados alterados — ${d.id}`,description:`${old.street}, ${old.number} → ${nw.street}, ${nw.number}. Motivo: ${reason}`});audit(`Entrega ${id} corrigida pelo comerciante`,{old,new:nw,reason});save();closeModal();renderMerchant();toast('Correção salva. Entregador e administração foram avisados.','success')}

let demoPanelVisible=false,merchantWizardStep=1,pwaPrompt=null;
window.addEventListener?.('beforeinstallprompt',e=>{e.preventDefault();pwaPrompt=e});
function initials(v){return String(v||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function relativeTime(ts){if(!ts)return'—';const s=Math.max(0,Math.floor((Date.now()-ts)/1000));if(s<10)return'agora';if(s<60)return`há ${s} s`;const m=Math.floor(s/60);if(m<60)return`há ${m} min`;const h=Math.floor(m/60);return`há ${h} h`}
function fmtDateTime(ts){if(!ts)return'—';const d=new Date(ts),now=new Date(),yest=new Date();yest.setDate(now.getDate()-1);const time=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});if(d.toDateString()===now.toDateString())return`Hoje, ${time}`;if(d.toDateString()===yest.toDateString())return`Ontem, ${time}`;return`${d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','')} · ${time}`}
function gpsQuality(c){if(!c.gps||!c.connection)return{label:'Sem sinal',cls:'gps-off'};if(c.lastPing&&Date.now()-c.lastPing>45000)return{label:'Fraco',cls:'gps-weak'};return{label:'Bom',cls:'gps-good'}}

function openPaymentFlow(rawIds){
  if(!session||session.role!=='merchant')return;
  const charges=paymentCharges(chargeIdsFrom(rawIds),session.merchantId);
  if(!charges||!charges.length)return toast('Escolha uma fatura válida para pagamento.','error');
  const pending=charges.find(c=>paymentSubmissionForCharge(c.id));
  if(pending)return toast('Já existe um comprovante em análise para esta fatura.');
  paymentDraft={chargeIds:charges.map(c=>c.id),method:'PIX'};
  const total=charges.reduce((sum,c)=>sum+Number(c.total||0),0);
  showModal('Pagar agora',`<div class="payment-checkout"><div class="payment-checkout-total"><span>Total selecionado</span><strong>${money(total)}</strong><small>${charges.length} fatura${charges.length>1?'s':''} · ${esc(charges.map(c=>c.id).join(', '))}</small></div><div class="payment-method-picker"><button data-pay-method="PIX" class="payment-method-choice active" onclick="selectPaymentMethod('PIX')"><span class="payment-method-symbol">PX</span><span><strong>PIX</strong><small>Pagamento pelo aplicativo do seu banco</small></span><b>›</b></button><button data-pay-method="Boleto" class="payment-method-choice" onclick="selectPaymentMethod('Boleto')"><span class="payment-method-symbol">BL</span><span><strong>Boleto</strong><small>Solicite e pague pelo canal combinado</small></span><b>›</b></button><div class="payment-method-disabled"><span>CR</span><span><strong>Cartão</strong><small>Integração futura</small></span></div></div><div id="paymentMethodDetail"></div><div class="field payment-note"><label>Mensagem para a Administração <span class="muted">(opcional)</span></label><textarea id="paymentNote" rows="2" maxlength="500" placeholder="Ex.: pago pelo responsável, comprovante enviado no WhatsApp"></textarea></div></div>`,`<button class="btn primary" onclick="recordPaymentFromModal()">Já paguei · registrar comprovante</button><button class="btn ghost" onclick="openPaymentWhatsApp()">Enviar no WhatsApp</button><button class="btn ghost" onclick="closeModal()">Voltar</button>`,true);
  renderPaymentMethodDetail()

function renderPaymentMethodDetail(){
  const box=el('paymentMethodDetail');if(!box)return;const settings=db.paymentSettings||{},pixKey=String(settings.pixKey||'').trim();
  if(paymentDraft.method==='PIX'){box.innerHTML=`<div class="payment-detail"><div><strong>Pagamento por PIX</strong><p>${pixKey?`Chave: <b>${esc(pixKey)}</b>${settings.pixRecipient?` · ${esc(settings.pixRecipient)}`:''}`:'A chave PIX ainda não foi configurada pela Administração.'}</p>${settings.pixInstructions?`<small>${esc(settings.pixInstructions)}</small>`:''}</div>${pixKey?`<button class="btn sm ghost" onclick="copyPixKey()">Copiar chave</button>`:`<button class="btn sm ghost" onclick="openPaymentWhatsApp()">Pedir chave</button>`}</div>`;return}
  box.innerHTML=`<div class="payment-detail"><div><strong>Boleto sob solicitação</strong><p>Peça o boleto ao financeiro, pague normalmente e depois registre o comprovante aqui.</p><small>O boleto automático depende de integração futura.</small></div><button class="btn sm ghost" onclick="openPaymentWhatsApp()">Solicitar boleto</button></div>`
}
function copyPixKey(){const key=String(db.paymentSettings?.pixKey||'').trim();if(!key)return toast('A chave PIX ainda não foi configurada.','error');const done=()=>toast('Chave PIX copiada.','success');if(navigator.clipboard?.writeText){navigator.clipboard.writeText(key).then(done).catch(()=>toast('Copie a chave exibida na tela.'))}else toast('Copie a chave exibida na tela.')}
function openPaymentWhatsApp(){const charges=paymentCharges(paymentDraft.chargeIds,session?.merchantId)||[],total=charges.reduce((sum,c)=>sum+Number(c.total||0),0),m=merchant(session?.merchantId);whatsapp(supportPhone(),`Olá, sou do ${m?.name||'comércio'}. ${paymentDraft.method==='Boleto'?'Preciso do boleto':'Vou enviar o comprovante PIX'} referente a ${charges.map(c=>c.id).join(', ')} no total de ${money(total)}.`)}
function recordPaymentFromModal(){const note=el('paymentNote')?.value||'';if(!submitPaymentProof(paymentDraft.chargeIds,paymentDraft.method,note))return;closeModal();currentMerchantTab='finance';renderMerchant();toast('Comprovante registrado para conferência da Administração.','success')}
function showPayment(mid){const charges=db.charges.filter(c=>c.merchantId===mid&&c.status==='Vencido');openPaymentFlow((charges.length?charges:db.charges.filter(c=>c.merchantId===mid&&c.status!=='Pago')).map(c=>c.id).join(','))}
function openMerchantCharge(id){
  const c=db.charges.find(x=>x.id===id&&x.merchantId===session?.merchantId);if(!c)return;const ds=(c.deliveryIds||[]).map(delivery).filter(Boolean),sub=paymentSubmissionForCharge(id);
  showModal(`Fatura ${esc(c.id)}`,`<div class="charge-detail-top"><span class="status ${statusColor(c.status)}">${esc(c.status)}</span><strong>${money(c.total)}</strong><p>${esc(c.period)} · vence ${esc(c.due)}</p>${sub?`<div class="payment-detail compact"><strong>Comprovante em análise</strong><p>${esc(paymentProofText(sub))}</p></div>`:''}</div><div class="section-title"><h3>Composição</h3></div>${ds.length?ds.map(d=>`<div class="delivery-box"><div class="head"><div><h4>${esc(d.id)} · ${esc(d.recipient)}</h4><p>${fmtDateTime(d.finishedAt)} · ${esc(d.street)}, ${esc(d.number)}</p></div><strong>${money(d.price)}</strong></div></div>`).join(''):'<p class="muted">Este ciclo de demonstração antigo não possui as entregas individuais vinculadas.</p>'}`,`${c.status!=='Pago'&&!sub?`<button class="btn primary" onclick="closeModal();openPaymentFlow('${c.id}')">Pagar agora</button>`:''}<button class="btn ghost" onclick="closeModal()">Fechar</button>`)
}

function openPaymentSettings(){
  if(!session?.main)return toast('Apenas o administrador principal configura os dados de pagamento.','error');const settings=db.paymentSettings||{};
  showModal('Dados de pagamento',`<div class="payment-settings-note">Esses dados só orientam o comerciante neste protótipo. Nenhuma transação bancária é processada pelo aplicativo.</div><div class="field"><label>Chave PIX</label><input id="pixKey" maxlength="160" value="${attr(settings.pixKey||'')}" placeholder="CPF, e-mail, telefone ou chave aleatória"></div><div class="field"><label>Nome do recebedor</label><input id="pixRecipient" maxlength="120" value="${attr(settings.pixRecipient||'')}" placeholder="Ex.: OAF Entregas"></div><div class="field"><label>Instrução exibida ao comerciante</label><textarea id="pixInstructions" maxlength="300" rows="3">${esc(settings.pixInstructions||'')}</textarea></div>`,`<button class="btn primary" onclick="savePaymentSettings()">Salvar dados</button><button class="btn ghost" onclick="closeModal()">Cancelar</button>`,true)
}
function savePaymentSettings(){
  if(!session?.main)return;db.paymentSettings={pixKey:el('pixKey').value.trim().slice(0,160),pixRecipient:el('pixRecipient').value.trim().slice(0,120),pixInstructions:el('pixInstructions').value.trim().slice(0,300)};audit('Dados de pagamento atualizados');save();closeModal();renderAdmin();toast('Dados de pagamento atualizados.','success')
}
function openPaymentReview(id){
  if(!guardPerm('finance_confirm')&&!session?.main)return;const s=(db.paymentSubmissions||[]).find(x=>x.id===id);if(!s)return;const charges=paymentCharges(s.chargeIds,s.merchantId)||[],m=merchant(s.merchantId);
  showModal('Conferir comprovante',`<div class="payment-review-head"><span class="status ${s.status==='Em análise'?'amber':s.status==='Confirmado'?'green':'red'}">${esc(s.status)}</span><strong>${money(s.total)}</strong><p>${esc(m?.name||'Comerciante')} · ${esc(paymentMethodLabel(s.method))} · enviado ${fmtDateTime(s.submittedAt)}</p></div><div class="payment-review-list">${charges.map(c=>`<div><span>${esc(c.id)} · ${esc(c.period)}</span><strong>${money(c.total)}</strong></div>`).join('')}</div>${s.note?`<div class="payment-review-note"><strong>Mensagem do comerciante</strong><p>${esc(s.note)}</p></div>`:''}${s.rejectionReason?`<div class="payment-review-note"><strong>Motivo da devolução</strong><p>${esc(s.rejectionReason)}</p></div>`:''}`,`${s.status==='Em análise'?`<button class="btn success" onclick="confirmPaymentSubmission('${s.id}')">Confirmar pagamento</button><button class="btn warn" onclick="openPaymentReturn('${s.id}')">Devolver comprovante</button>`:''}<button class="btn ghost" onclick="closeModal()">Fechar</button>`,true)
}
function openPaymentReturn(id){showModal('Devolver comprovante',`<div class="field"><label>Motivo obrigatório</label><textarea id="paymentReturnReason" rows="3" maxlength="500" placeholder="Ex.: valor não confere ou comprovante ilegível"></textarea></div>`,`<button class="btn warn" onclick="returnPaymentSubmission('${id}')">Devolver para o comerciante</button><button class="btn ghost" onclick="openPaymentReview('${id}')">Voltar</button>`)}
function returnPaymentSubmission(id){if(rejectPaymentSubmission(id,el('paymentReturnReason').value)){closeModal();renderAdmin();toast('Comprovante devolvido para correção.','success')}}
function adminFinance(){
  if(!guardPerm('finance_view')&&!session?.main)return;runBillingAutomation();recalcChargeStatuses();const unpaid=db.charges.filter(c=>c.status!=='Pago'),overdue=unpaid.filter(c=>c.status==='Vencido'),pending=(db.paymentSubmissions||[]).filter(s=>s.status==='Em análise'),paid=db.charges.filter(c=>c.status==='Pago');
  el('adminContent').innerHTML=`<div class="admin-finance"><section class="admin-finance-overview"><div class="admin-finance-copy"><span>Financeiro</span><h3>Conferência simples, sem confundir pagamento com comprovante.</h3><p>Um comprovante enviado pelo comerciante nunca libera a conta sozinho: a Administração precisa confirmar.</p></div><div class="admin-finance-actions">${session.main?`<button class="btn ghost" onclick="openPaymentSettings()">Configurar PIX</button>`:''}<span class="status ${pending.length?'amber':'green'}">${pending.length?`${pending.length} para conferir`:'Sem comprovantes pendentes'}</span></div></section><div class="finance-kpi-grid"><div><span>Em aberto</span><strong>${money(unpaid.reduce((sum,c)=>sum+c.total,0))}</strong></div><div class="danger"><span>Vencidas</span><strong>${overdue.length}</strong></div><div class="attention"><span>Comprovantes em análise</span><strong>${pending.length}</strong></div><div class="good"><span>Faturas pagas</span><strong>${paid.length}</strong></div></div><section class="admin-proof-queue"><div class="admin-proof-head"><div><h3>Comprovantes para conferir</h3><p>${pending.length?'Confirme somente depois de validar o recebimento.':'Nada aguardando conferência agora.'}</p></div></div>${pending.length?`<div class="admin-proof-list">${pending.map(s=>{const m=merchant(s.merchantId);return`<article class="admin-proof-row"><div class="proof-icon">${s.method==='PIX'?'PX':'BL'}</div><div class="proof-copy"><strong>${esc(m?.name||'Comerciante')}</strong><span>${esc(s.chargeIds.join(', '))} · ${esc(paymentMethodLabel(s.method))} · ${fmtDateTime(s.submittedAt)}</span></div><strong class="proof-value">${money(s.total)}</strong><button class="btn sm primary" onclick="openPaymentReview('${s.id}')">Conferir</button></article>`}).join('')}</div>`:`<div class="ops-empty"><strong>Caixa financeira vazia</strong>Os comprovantes enviados pelos comerciantes aparecerão aqui.</div>`}</section><div class="section-title"><h3>Faturas</h3><span class="muted">Ações manuais continuam registradas na Auditoria.</span></div><div class="table-wrap"><table class="table mobile-stack"><thead><tr><th>ID</th><th>Comércio</th><th>Período</th><th>Total</th><th>Vencimento</th><th>Status</th><th></th></tr></thead><tbody>${db.charges.slice().sort((a,b)=>(a.status==='Vencido'?0:1)-(b.status==='Vencido'?0:1)||(a.dueTs||0)-(b.dueTs||0)).map(c=>{const proof=paymentSubmissionForCharge(c.id);return`<tr><td data-label="ID">${esc(c.id)}</td><td data-label="Comércio">${esc(merchant(c.merchantId)?.name||'—')}</td><td data-label="Período">${esc(c.period)}</td><td data-label="Total">${money(c.total)}</td><td data-label="Vencimento">${esc(c.due)}</td><td data-label="Status"><span class="status ${statusColor(c.status)}">${esc(c.status)}</span>${proof?'<br><span class="small muted">Comprovante em análise</span>':''}</td><td data-label="Ações"><div class="invoice-admin-actions">${c.status!=='Pago'&&(session.main||hasPerm('finance_confirm'))?`<button class="btn sm ${proof?'primary':'success'}" onclick="${proof?`openPaymentReview('${proof.id}')`:`markPaid('${c.id}')`}">${proof?'Conferir':'Confirmar'}</button>`:''}${session.main||hasPerm('finance_adjust')?`<button class="btn sm ghost" onclick="openAdjustCharge('${c.id}')">Ajustar</button>`:''}<button class="btn sm ghost" onclick="openChargeDetail('${c.id}')">Detalhes</button></div></td></tr>`}).join('')}</tbody></table></div></div>`
}

function adminRefCourierState(c){
  if(!c.connection||!c.gps)return{label:'SEM SINAL',tone:'red',ico:'pending'};
  if(c.status==='Disponível')return{label:'LIVRE',tone:'green',ico:'check'};
  if(c.status==='Em rota'||c.status==='Cheguei ao destino')return{label:'EM ENTREGA',tone:'teal',ico:'deliveries'};
  if(['Atribuída','Indo buscar','Cheguei ao comércio','Mercadoria coletada'].includes(c.status))return{label:'A CAMINHO',tone:'blue',ico:'route'};
  return{label:'OCUPADO',tone:'orange',ico:'pending'}
}

function mascotModalBody(kind,kicker,title,text,note=''){
  const seal=kind==='success'?'check':kind==='warning'?'pending':kind==='error'?'pending':'check';
  return `<div class="popup-mascot ${kind}"><div class="popup-state-seal">${icon(seal,'bottom-icon')}</div><span class="popup-kicker">${esc(kicker)}</span><h2>${esc(title)}</h2><p class="popup-subtitle">${esc(text)}</p><img class="popup-mascot-art" src="${duckPopupArt(kind)}" alt=""><div class="popup-note">${esc(note)}</div></div>`
}
function showModal(title,body,actions='',wide=false){
  const mascot=String(body||'').includes('popup-mascot');
  el('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal ${wide?'wide':''} ${mascot?'mascot-modal':''}">${mascot?`<button class="mascot-close" aria-label="Fechar" onclick="closeModal()">×</button>`:`<div class="sheet-handle"></div><div class="modal-head"><h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div>`}${body}<div class="modal-actions">${actions}</div></div></div>`
}
function closeDuckStory(){const r=el('modalRoot');if(r)r.innerHTML=''}
function startAssignedDelivery(id){
  const d=delivery(id);if(!d||d.status!=='Atribuída'||d.courierId!==session.courierId)return;
  (db.internalMessages||[]).filter(m=>m.courierId===session.courierId&&m.deliveryId===id&&!m.read).forEach(m=>{m.read=true;m.readAt=Date.now()});
  save();confirmCourierAdvance(id)
}

// Cancelamentos ganham identidade própria sem alterar as regras.
function cancelWaiting(id){const d=delivery(id);if(!d||d.merchantId!==session.merchantId||d.status!=='Aguardando entregador')return;showDuckStory({theme:'sad',title:'Cancelar esta solicitação?',text:`O pedido ${id} ainda não foi atribuído. Se cancelar agora, ele sairá da fila.`,note:'Esta ação não pode ser desfeita.',primary:{label:'Cancelar solicitação',action:`confirmCancelWaitingV332('${attr(id)}')`},secondary:{label:'Manter pedido',action:'closeDuckStory()'}})}
function confirmCancelWaitingV332(id){const d=delivery(id);if(!d||d.merchantId!==session.merchantId||d.status!=='Aguardando entregador')return;d.status='Cancelada';d.history.push(['Cancelada pelo comerciante',Date.now()]);audit(`Solicitação cancelada antes da atribuição: ${id}`);save();closeDuckStory();renderMerchant();toast('Solicitação cancelada.')}
function confirmAdminCancelV332(id){const d=delivery(id),reason=el('duckCancelReason')?.value.trim();if(!reason)return toast('Informe o motivo.','error');if(d.courierId){const c=courier(d.courierId);c.status='Disponível'}d.status='Cancelada';d.history.push([`Cancelamento excepcional · ${reason}`,Date.now()]);createOccurrence({type:'Cancelamento',severity:'Atenção',deliveryId:d.id,courierId:d.courierId,merchantId:d.merchantId,title:`Entrega ${d.id} cancelada excepcionalmente`,description:reason});audit(`Cancelamento excepcional: ${id}`,{reason});engineQueue('cancelamento excepcional');save();closeDuckStory();renderAdmin();toast('Entrega cancelada excepcionalmente.')}

// Confirmação financeira usa o personagem temático "personagem financeiro".
function confirmPaymentSubmission(id){const s=(db.paymentSubmissions||[]).find(x=>x.id===id);if(!s)return;const m=merchant(s.merchantId);showDuckStory({theme:'rich',title:'Confirmar pagamento?',text:`Confirme somente depois de validar o recebimento de ${money(s.total)} de ${m?.name||'comerciante'}.`,note:'As faturas vinculadas serão marcadas como pagas e a situação financeira será recalculada.',primary:{label:'Confirmar pagamento',action:`confirmPaymentSubmissionV332('${attr(id)}')`},secondary:{label:'Voltar',action:'closeDuckStory()'}})}
function confirmPaymentSubmissionV332(id){const s=(db.paymentSubmissions||[]).find(x=>x.id===id),m=s?merchant(s.merchantId):null,total=s?.total||0;if(!s)return;if(settlePaymentSubmission(id)){closeDuckStory();renderAdmin();showDuckStory({theme:'rich',title:'Pagamento confirmado!',text:`${money(total)} de ${m?.name||'comerciante'} foi confirmado com sucesso.`,note:'✓ As faturas foram atualizadas e o acesso financeiro foi recalculado.',primary:{label:'Bora pra próxima',action:"closeDuckStory();currentAdminTab='finance';renderAdmin()"}})}}
function markPaid(id){if(!guardPerm('finance_confirm')&&!session?.main)return;const c=db.charges.find(x=>x.id===id);if(!c)return;const proof=paymentSubmissionForCharge(id);if(proof)return openPaymentReview(proof.id);const m=merchant(c.merchantId);showDuckStory({theme:'rich',title:'Confirmar manualmente?',text:`Marcar ${money(c.total)} de ${m?.name||'comerciante'} como recebido?`,note:'Use esta opção somente depois de conferir o recebimento fora do aplicativo.',primary:{label:'Confirmar pagamento',action:`confirmManualChargeV332('${attr(id)}')`},secondary:{label:'Voltar',action:'closeDuckStory()'}})}
function confirmManualChargeV332(id){const c=db.charges.find(x=>x.id===id);if(!c)return;const m=merchant(c.merchantId);c.status='Pago';c.paidAt=Date.now();c.paidBy=session.name;c.paymentReference='MANUAL';audit(`Pagamento confirmado manualmente: ${id}`,{merchantId:c.merchantId,total:c.total});save();closeDuckStory();renderAdmin();showDuckStory({theme:'rich',title:'Pagamento confirmado!',text:`${money(c.total)} de ${m?.name||'comerciante'} foi registrado como recebido.`,note:'✓ Registro salvo na Auditoria.',primary:{label:'Bora pra próxima',action:"closeDuckStory();currentAdminTab='finance';renderAdmin()"}})}

/* A entrega é a fonte de verdade: sempre restaura o popup enquanto estiver Atribuída. */
function scheduleAssignedDeliveryPopup(){
  if(session?.role!=='courier')return;
  const d=db.deliveries.find(x=>x.courierId===session.courierId&&x.status==='Atribuída');
  if(!d)return;
  setTimeout(()=>{
    if(session?.role!=='courier')return;
    const current=delivery(d.id);
    if(!current||current.status!=='Atribuída'||current.courierId!==session.courierId)return;
    const root=el('modalRoot');
    if(!root)return;
    if(!root.querySelector('.fullscreen-assignment'))assignedDeliveryPopup(current.id)
  },60)
}

/* Reforço leve contra fechamento acidental/programático do popup obrigatório. */
if(!window.__EL_ASSIGNED_POPUP_GUARD__){
  window.__EL_ASSIGNED_POPUP_GUARD__=true;
  document.addEventListener('keydown',e=>{
    if(e.key!=='Escape'||session?.role!=='courier')return;
    const pending=db?.deliveries?.find?.(x=>x.courierId===session.courierId&&x.status==='Atribuída');
    if(pending){e.preventDefault();e.stopPropagation();scheduleAssignedDeliveryPopup()}
  },true);
  setInterval(()=>{
    if(session?.role!=='courier')return;
    const pending=db?.deliveries?.find?.(x=>x.courierId===session.courierId&&x.status==='Atribuída');
    if(!pending)return;
    const root=document.getElementById('modalRoot');
    if(root&&!root.querySelector('.fullscreen-assignment'))assignedDeliveryPopup(pending.id)
  },1500);
}



/* Persistência de sessão v3.4.0:
   permite fechar/reabrir o PWA e continuar exatamente na operação pendente. */
const EL_SESSION_KEY_V340='OAF_ENTREGAS_SESSION_V1';

function persistSessionV340(){
  if(session?.id) storageSet(EL_SESSION_KEY_V340,JSON.stringify({id:session.id}));
  else storageRemove(EL_SESSION_KEY_V340);
}
function restoreSessionV340(){
  const raw=storageGet(EL_SESSION_KEY_V340);
  if(!raw)return null;
  try{
    const ref=JSON.parse(raw),u=db.users.find(x=>x.id===ref.id&&x.active);
    if(!u){storageRemove(EL_SESSION_KEY_V340);return null}
    if(u.role==='courier'){
      const c=courier(u.courierId);
      if(!c||c.adminBlocked){storageRemove(EL_SESSION_KEY_V340);return null}
      /* Uma sessão restaurada representa que o app foi reaberto pelo mesmo entregador.
         Ele permanece na operação, conservando fila e entrega existentes. */
      if(!c.online){
        c.online=true;
        c.status=db.deliveries.some(d=>d.courierId===c.id&&isActive(d))
          ? (db.deliveries.find(d=>d.courierId===c.id&&isActive(d))?.status||'Disponível')
          : 'Disponível';
        c.connection=true;c.gps=true;c.lastPing=Date.now();
        if(!c.queue)c.queue=Math.max(0,...db.couriers.filter(x=>x.online&&x.id!==c.id).map(x=>x.queue||0))+1;
        normalizeOnlineQueue();
        save();
      }
    }
    return {...u}
  }catch(e){
    storageRemove(EL_SESSION_KEY_V340);
    return null
  }
}

/* Mantém a função original de login e apenas acrescenta persistência. */
const _loginUserV340=loginUser;
loginUser=function(login,password){
  const before=session?.id||null;
  _loginUserV340(login,password);
  if(session?.id&&session.id!==before)persistSessionV340()
};

const _logoutV340=logout;
logout=function(){
  const wasCourier=session?.role==='courier';
  _logoutV340();
  if(!wasCourier&&!session)persistSessionV340()
};

const _demoSwitchUserV340=demoSwitchUser;
demoSwitchUser=function(){
  storageRemove(EL_SESSION_KEY_V340);
  _demoSwitchUserV340()
};

/* TESTE TEMPORÁRIO — PREENCHIMENTO AUTOMÁTICO DE LOGIN.
   Não altera autenticação nem entra sozinho; apenas preenche login e senha.
   Remova este bloco e o bloco visual em renderLogin() quando os testes terminarem. */
function autofillTestLogin(profileLogin){
  const u=db.users.find(x=>x.login===profileLogin&&x.active);
  if(!u)return toast('Perfil de teste não encontrado.','error');
  const loginInput=el('login'),passwordInput=el('password');
  if(!loginInput||!passwordInput)return;
  loginInput.value=u.login;
  passwordInput.value=u.password;
  loginInput.dispatchEvent(new Event('input',{bubbles:true}));
  passwordInput.dispatchEvent(new Event('input',{bubbles:true}));
  passwordInput.focus();
}


/* ======================== INICIALIZAÇÃO ======================== */
function boot(){
  try{recalcChargeStatuses();engineQueue('inicialização');save();render()}
  catch(err){
    console.error(err);
    const root=document.getElementById('app');
    if(root) root.innerHTML='<div style="font-family:Arial,sans-serif;padding:24px;max-width:700px;margin:40px auto"><h2>Não foi possível iniciar o aplicativo</h2><p>Abra este arquivo no Google Chrome ou outro navegador atualizado.</p><pre style="white-space:pre-wrap;background:#f4f4f4;padding:12px;border-radius:8px">'+String(err && err.message ? err.message : err)+'</pre></div>';
  }
}

const OAF_COURIER_ASSETS=[OAF_ASSET_COURIER_DEFAULT,OAF_ASSET_COURIER_FRONT,OAF_ASSET_COURIER_CROSS,OAF_ASSET_COURIER_OK,OAF_ASSET_COURIER_THUMB];

function oafSubjectKey(subject){
  if(subject&&typeof subject==='object')return String(subject.id||subject.nick||subject.name||'courier');
  return String(subject||'courier');
}
function oafStableIndex(subject,len=OAF_COURIER_ASSETS.length){
  const raw=oafSubjectKey(subject).toLowerCase();let h=0;for(let i=0;i<raw.length;i++)h=((h<<5)-h+raw.charCodeAt(i))|0;return Math.abs(h)%len
}
function oafCourierSrc(subject='',pose='stable'){
  if(pose==='assigned')return OAF_ASSET_COURIER_ASSIGNED;
  if(pose==='thumb')return OAF_ASSET_COURIER_THUMB2;
  if(pose==='ok')return OAF_ASSET_COURIER_OK;
  if(pose==='cross')return OAF_ASSET_COURIER_CROSS;
  if(pose==='front')return OAF_ASSET_COURIER_FRONT;
  return OAF_COURIER_ASSETS[oafStableIndex(subject)]||OAF_ASSET_COURIER_DEFAULT
}
function oafIsAdminSubject(subject){
  const k=oafSubjectKey(subject).toLowerCase();return k==='admin'||k.includes('administrador')||k==='administrator'
}
function duckPopupArt(kind='route'){
  if(['success','celebrate'].includes(kind))return OAF_ASSET_COURIER_THUMB2;
  if(['warning','alert','sad'].includes(kind))return OAF_ASSET_COURIER_FRONT;
  if(['support','gps'].includes(kind))return OAF_ASSET_COURIER_OK;
  return OAF_ASSET_COURIER_DEFAULT
}
function duckStoryArt(theme){
  if(theme==='celebrate')return OAF_ASSET_COURIER_THUMB2;
  if(theme==='sad'||theme==='alert')return OAF_ASSET_COURIER_FRONT;
  if(theme==='support'||theme==='gps')return OAF_ASSET_COURIER_OK;
  if(theme==='waiting')return OAF_ASSET_COURIER_THUMB;
  return OAF_ASSET_COURIER_DEFAULT
}
function appLogo(cls=''){
  return `<span class="brand-logo ${cls}" aria-hidden="true"><img src="${OAF_ASSET_COURIER_DEFAULT}" alt=""></span>`
}
function oafFullLogo(){return `<span class="oaf-brand-lockup"><img class="oaf-full-logo" src="${OAF_ASSET_LOGO}" alt="OAF Entregas"></span>`}
function adminRefHeroArt(){return `<div style="display:grid;place-items:center;width:100%;height:100%">${appLogo()}</div>`}

function oafStoryBadge(raw,theme){
  if(raw&&!/patinho/i.test(raw))return raw;
  return ({celebrate:'Entrega concluída',waiting:'Etapa de coleta',accelerated:'Coleta confirmada',door:'Em rota',sad:'Atenção',alert:'Atenção operacional',support:'Suporte OAF',route:'Operação OAF',rich:'Financeiro',gps:'Localização'}[theme]||'OAF Entregas')
}

function oafMerchantInitials(name='Comércio'){
  const parts=String(name).trim().split(/\s+/).filter(Boolean);return (parts[0]?.[0]||'C')+(parts.length>1?(parts[parts.length-1]?.[0]||''):'')
}
function oafEstimatedDistanceKm(d){

function oafCourierPhaseIndex(status){
  if(status==='Atribuída')return 0;
  if(['Indo buscar','Cheguei ao comércio'].includes(status))return 1;

  if(['Em rota','Cheguei ao destino'].includes(status))return 3;

  catch(err){oaf11Pending=oaf11Pending||item;clearTimeout(oaf11RetryTimer);oaf11RetryTimer=setTimeout(()=>{if(oaf11Connected)oaf11Flush();else oaf11RetryNow()},2200)}finally{oaf11Pushing=false;if(oaf11Pending&&oaf11Connected)queueMicrotask(oaf11Flush)}

async function oaf11Pull(renderAfter=true){if(!session)return;const data=await oaf11Fetch('/api/state');if(Number(data.revision||0)>oaf11Revision||!oaf11Ready)oaf11ApplySnapshot(data.state,data.revision,null,renderAfter)}
function oaf11Events(){
  try{oaf11EventSource?.close()}catch{};if(!session)return;const es=new EventSource('/api/events',{withCredentials:true});oaf11EventSource=es;
  es.addEventListener('state',async e=>{try{const m=JSON.parse(e.data||'{}');if(Number(m.revision||0)<=oaf11Revision)return;if(oaf11Pushing||oaf11Pending)return;await oaf11Pull(true)}catch{}});
  es.onerror=()=>{try{es.close()}catch{};if(session)setTimeout(()=>{if(oaf11Connected)oaf11Events()},1800)}
}
async function oaf11RetryNow(){try{const c=await oaf11Fetch('/api/config');oaf11Config=c;oaf11Online();if(session){await oaf11Pull(true);oaf11Events();if(oaf11Pending)oaf11Flush()}else if(c.setupRequired)renderInitialSetup();else render()}catch{}}

/* O servidor é a autoridade da fila e das automações financeiras. */
engineQueue=function(){return false};
runBillingAutomation=function(){recalcChargeStatuses();return false};
const _oaf11LocalSave=save;
save=function(){oaf11Cache();if(oaf11Ready&&session)oaf11SchedulePush();return true};
persistSessionV340=function(){};
restoreSessionV340=function(){return null};

loginUser=async function(login,password){
  if(!oaf11Ready)return toast('A conexão com o servidor ainda está sendo preparada.','error');
  try{oaf11SyncBadge('ENTRANDO…');const data=await oaf11Fetch('/api/login',{method:'POST',body:JSON.stringify({login,password})});oaf11Csrf=data.csrf||'';session={...data.user};oaf11ApplySnapshot(data.state,data.revision,data.user,false);oaf11Events();render();if(session?.mustChangePassword)setTimeout(openMandatoryPasswordChange,80);setTimeout(scheduleAssignedDeliveryPopup,100)}catch(err){toast(err.message||'Não foi possível entrar.','error')}
};
logout=async function(){
  if(session?.role==='courier')return toast('Entregadores saem somente por solicitação aprovada.','error');
  try{await oaf11Fetch('/api/logout',{method:'POST',body:'{}'})}catch(err){if(err.status!==401)return toast(err.message,'error')}
  try{oaf11EventSource?.close()}catch{};oaf11Csrf='';oaf11Revision=0;session=null;db=makeProductionSeed();oaf11Cache();render()
};
demoSwitchUser=function(){return toast('Atalho disponível somente na versão de testes.','error')};

needsInitialSetup=function(){return !!oaf11Config?.setupRequired};
function oaf11LegacyCanMigrate(){const s=OAF11_LEGACY_LOCAL,main=s?.users?.find?.(u=>u.role==='admin'&&u.main&&u.active);return !!(main&&String(main.password||'').length>=4)}
renderInitialSetup=function(){
  const root=el('app');if(!root)return;const migrate=oaf11LegacyCanMigrate()?`<div class="oaf11-migrate"><strong>Base v1.0.0 encontrada neste aparelho</strong><p>Você pode enviar usuários, comerciantes, entregadores, pedidos, financeiro e histórico desta base local para o novo servidor central.</p><button class="btn outline full" type="button" onclick="oaf11ImportLegacy()">MIGRAR BASE LOCAL PARA O SERVIDOR</button></div>`:'';
  root.innerHTML=`<div class="oaf-release-setup"><section class="oaf-release-card"><div class="oaf-release-brand">${oafFullLogo()}<div><span>ETAPA 12 · PRODUÇÃO HTTPS</span><h1>OAF Entregas</h1><p>Olho D’Água das Flores · AL</p></div></div><div class="oaf-release-intro"><strong>Configure o Administrador Principal no servidor</strong><p>Usuários de celulares diferentes passarão a usar a mesma base. O código de configuração aparece no terminal onde o servidor foi iniciado.</p></div>${migrate}<form id="releaseSetupForm" autocomplete="off"><div class="field"><label>Código de configuração do servidor</label><input class="oaf11-setup-code" id="setupServerCode" inputmode="numeric" maxlength="6" required placeholder="000000"></div><div class="field"><label>Nome do administrador</label><input id="setupAdminName" maxlength="80" required placeholder="Ex.: Administrador Principal"></div><div class="field"><label>Login</label><input id="setupAdminLogin" maxlength="40" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Crie um login"></div><div class="form-grid"><div class="field"><label>Senha</label><input id="setupAdminPass" type="password" minlength="4" required autocomplete="new-password"></div><div class="field"><label>Confirmar senha</label><input id="setupAdminPass2" type="password" minlength="4" required autocomplete="new-password"></div></div><div class="field"><label>WhatsApp da Administração</label><input id="setupSupportPhone" inputmode="tel" placeholder="(82) 99999-9999"></div><button class="btn primary full" type="submit">CRIAR SERVIDOR DA OPERAÇÃO</button></form><div class="oaf11-backend-note">A partir desta versão, o SQLite do servidor é a fonte oficial dos dados. O navegador mantém apenas uma cópia de apoio da última sincronização.</div></section></div>`;el('releaseSetupForm').onsubmit=e=>{e.preventDefault();completeInitialSetup()}
};
completeInitialSetup=async function(){
  const code=el('setupServerCode')?.value.trim()||'',name=el('setupAdminName')?.value.trim()||'',login=el('setupAdminLogin')?.value.trim()||'',pass=el('setupAdminPass')?.value||'',pass2=el('setupAdminPass2')?.value||'',phone=phoneDigits(el('setupSupportPhone')?.value||'');
  if(!/^\d{6}$/.test(code))return toast('Informe o código de 6 dígitos mostrado pelo servidor.','error');if(!name||!login||pass.length<4)return toast('Preencha nome, login e senha com pelo menos 4 caracteres.','error');if(pass!==pass2)return toast('As senhas não conferem.','error');
  try{const data=await oaf11Fetch('/api/setup',{method:'POST',body:JSON.stringify({setupCode:code,name,login,password:pass,supportPhone:phone})});oaf11Config={...(oaf11Config||{}),setupRequired:false};oaf11Csrf=data.csrf||'';session={...data.user};oaf11ApplySnapshot(data.state,data.revision,data.user,false);oaf11Events();render();toast('Servidor central configurado.','success')}catch(err){toast(err.message||'Não foi possível configurar o servidor.','error')}
};
async function oaf11ImportLegacy(){
  if(!oaf11LegacyCanMigrate())return toast('Esta base local não possui credenciais suficientes para migração.','error');const code=prompt('Digite o código de 6 dígitos exibido pelo servidor:')||'';if(!/^\d{6}$/.test(code))return toast('Código inválido.','error');
  try{oaf11SyncBadge('MIGRANDO…');const data=await oaf11Fetch('/api/setup',{method:'POST',body:JSON.stringify({setupCode:code,importState:OAF11_LEGACY_LOCAL})});oaf11Config={...(oaf11Config||{}),setupRequired:false};oaf11Csrf=data.csrf||'';session={...data.user};oaf11ApplySnapshot(data.state,data.revision,data.user,false);oaf11Events();render();toast('Base local migrada para o servidor.','success')}catch(err){toast(err.message||'Não foi possível migrar a base.','error')}
}

async function backendBootV11(){
  try{
    el('app').innerHTML=`<div class="splash-screen"><div class="splash-inner">${oafFullLogo()}<h1>OAF Entregas</h1><div class="splash-city">Conectando ao servidor central…</div></div></div>`;registerPwa();
    oaf11Config=await oaf11Fetch('/api/config');oaf11Ready=true;
    if(oaf11Config.setupRequired){db=makeProductionSeed();session=null;return renderInitialSetup()}
    const sess=await oaf11Fetch('/api/session');
    if(sess.authenticated){oaf11Csrf=sess.csrf||'';session={...sess.user};oaf11ApplySnapshot(sess.state,sess.revision,sess.user,false);oaf11Events();render();setTimeout(scheduleAssignedDeliveryPopup,100)}
    else{session=null;db=makeProductionSeed();render()}
  }catch(err){oaf11Ready=false;oaf11Offline('Não foi possível iniciar a conexão com o backend OAF.')}
}

backendBootV11();
