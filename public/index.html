:root{
  --bg:#f5f7fb;
  --panel:#ffffff;
  --panel2:#f0f3f8;
  --text:#111827;
  --muted:#667085;
  --line:#e4e9f1;
  --primary:#2563eb;
  --primary2:#1748bd;
  --green:#16835c;
  --red:#c83f49;
  --amber:#b7791f;
  --blue:#225dc7;
  --dark:#0f172a;
  --shadow:0 16px 42px rgba(15,23,42,.075);
  --shadow-soft:0 7px 22px rgba(15,23,42,.055);
  --shadow-float:0 22px 60px rgba(15,23,42,.14);
  --radius:20px;
  --radius2:14px;
  --yellow:#f2c94c;
}
*{-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.01em}
body{min-width:320px}
::selection{background:#dbeafe;color:#0f172a}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd3df;border:3px solid transparent;background-clip:padding-box;border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:#aeb8c7;border:3px solid transparent;background-clip:padding-box}

/* LOGIN */
.login-wrap{
  position:relative;overflow:hidden;padding:28px;
  background:
    radial-gradient(circle at 12% 12%,rgba(37,99,235,.14),transparent 27%),
    radial-gradient(circle at 88% 82%,rgba(242,201,76,.12),transparent 25%),
    linear-gradient(145deg,#f8fafc 0%,#eef3fa 52%,#f7f9fc 100%);
}
.login-wrap:before,.login-wrap:after{content:"";position:absolute;border-radius:999px;pointer-events:none;filter:blur(1px)}
.login-wrap:before{width:330px;height:330px;left:-190px;bottom:-170px;background:rgba(15,23,42,.035)}
.login-wrap:after{width:230px;height:230px;right:-120px;top:-100px;border:1px solid rgba(37,99,235,.12)}
.login-card{
  position:relative;z-index:1;width:min(445px,100%);padding:34px;
  border:1px solid rgba(226,232,240,.92);border-radius:26px;
  background:rgba(255,255,255,.94);box-shadow:0 30px 80px rgba(15,23,42,.12);
}
.brand{gap:15px;margin-bottom:29px}.brandmark{
  width:52px;height:52px;border-radius:17px;position:relative;overflow:visible;
  background:linear-gradient(145deg,#0b1220,#17233a);box-shadow:0 10px 24px rgba(15,23,42,.19);
  letter-spacing:-1.5px;font-size:16px;
}
.brandmark:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;right:-2px;bottom:-2px;background:var(--yellow);border:3px solid #fff}
.brand h1{font-size:23px;line-height:1.1;letter-spacing:-.04em}.brand p{font-size:12.5px;margin-top:5px}
.field{gap:8px;margin:14px 0}.field label{font-size:12px;letter-spacing:.01em;color:#344054}
.field input,.field select,.field textarea{
  min-height:46px;border:1px solid #d9e0ea;border-radius:13px;padding:12px 14px;background:#fff;color:var(--text);
  box-shadow:0 1px 2px rgba(15,23,42,.02);transition:border-color .16s,box-shadow .16s,background .16s;
}
.field textarea{min-height:94px;resize:vertical}.field input:hover,.field select:hover,.field textarea:hover{border-color:#c7d0dc}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#7aa2f7;box-shadow:0 0 0 4px rgba(37,99,235,.10);background:#fff}
.btn{min-height:42px;border-radius:12px;padding:11px 16px;font-weight:760;letter-spacing:-.01em;box-shadow:none;transition:transform .14s,box-shadow .14s,background .14s,border-color .14s,opacity .14s}
.btn:hover:not(:disabled){transform:translateY(-1px)}.btn:active:not(:disabled){transform:translateY(0)}
.btn.primary{background:linear-gradient(180deg,#2f6ff0,#2259d4);box-shadow:0 8px 20px rgba(37,99,235,.20)}
.btn.primary:hover{background:linear-gradient(180deg,#2b65dc,#1c4fc0);box-shadow:0 10px 24px rgba(37,99,235,.24)}
.btn.dark{background:#111827;box-shadow:0 8px 20px rgba(15,23,42,.14)}
.btn.ghost{background:#f0f3f7}.btn.ghost:hover{background:#e8edf3}.btn.outline{border-color:#dce2ea}.btn.outline:hover{border-color:#c6cfdb;background:#f9fafb}
.btn.success{background:#e7f7f0;color:#0c694b}.btn.warn{background:#fff5d9;color:#815800}.btn.danger{background:#fdecef;color:#ad2f3b}
.btn.sm{min-height:34px;border-radius:10px}.btn.xs{min-height:30px;border-radius:9px}

/* ======================================================================
   CAMADA VISUAL FINAL v3 — identidade, iconografia e ergonomia
   ====================================================================== */
:root{
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;
  --navy:#111827;--navy-2:#1f2937;--brand:#2563eb;--brand-strong:#1d4ed8;--brand-soft:#eef4ff;
  --success:#16835c;--warning:#b7791f;--critical:#c83f49;--surface:#fff;--surface-soft:#f7f9fc;
}
body{font-feature-settings:"tnum" 1,"ss01" 1;font-variant-numeric:tabular-nums}
.metric,.queue-number,.kpi-mini strong,.invoice-total,.op-strip strong,.ticket-number,.timeline-time{font-variant-numeric:tabular-nums}

/* Marca */

.login-card{max-width:430px}.login-card .brand{align-items:center;margin-bottom:26px}

.queue-node .qnum{font-size:11px;color:#7c8798}.queue-node strong{display:block;font-size:13px;margin-top:3px}.queue-node small{color:#7a8493;font-size:10px}
.queue-node.busy{background:#fffaf0;border-color:#eddcb1}.queue-node.alerting{background:#fff4f5;border-color:#efc8cc}
.busy-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.busy-chip{padding:8px 10px;border-radius:12px;background:#fff8e7;border:1px solid #f1dfb0;font-size:11px}

/* Alertas por ícone + cor */
.alert .icon{color:#8a620f}.alert.critical .icon{color:#b63541}.alert.info .icon{color:#245cbf}.alert.success .icon{color:#167454}
.alert.critical{animation:urgentOnce .7s ease-out 1}@keyframes urgentOnce{0%{transform:scale(.99)}45%{transform:scale(1.006)}100%{transform:scale(1)}}

/* Cards e listas */
.card,.delivery-box,.queue-card,.courier-current{box-shadow:0 4px 16px rgba(15,23,42,.045)}
.card:hover,.delivery-box:hover{transform:none}
.entity-cell{display:flex;align-items:center;gap:10px}.initial-avatar{width:36px;height:36px;border-radius:12px;background:#eef3fa;color:#31578f;display:grid;place-items:center;font-weight:850;font-size:11px;border:1px solid #dde6f1}
.row-menu{width:34px;height:34px;border:1px solid #e1e6ed;background:#fff;border-radius:10px;font-size:18px;line-height:1;color:#667085}
.row-menu:hover{background:#f7f9fc}
.delivery-box.v3{padding:14px 15px}.delivery-box.v3 .delivery-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.delivery-id{font-size:11px;font-weight:900;color:#607089;letter-spacing:.04em}.delivery-name{font-size:14px;font-weight:820;margin-top:3px}.delivery-address{font-size:12px;color:#596579;margin-top:4px}.delivery-meta{display:flex;gap:10px;flex-wrap:wrap;color:#7a8495;font-size:10.5px;margin-top:9px}.progress-track{height:5px;background:#e8ecf2;border-radius:999px;margin-top:12px;overflow:hidden}.progress-fill{height:100%;background:var(--brand);border-radius:999px;transition:width .25s ease}

/* Mapa urbano */
.map{background:#eef3f6;background-image:none}.city-block{position:absolute;background:#f9fbfc;border:1px solid #dfe6eb;border-radius:8px;box-shadow:0 2px 6px rgba(15,23,42,.025)}
.map .road{background:#d2dbe2;box-shadow:0 0 0 5px rgba(255,255,255,.82)}
.map-popover{position:absolute;left:14px;bottom:14px;z-index:5;width:min(300px,calc(100% - 28px));background:#fff;border:1px solid #dde4eb;border-radius:15px;padding:13px;box-shadow:0 18px 38px rgba(15,23,42,.15);animation:fadeUp .16s ease-out}
.map-popover.hidden{display:none}.map-popover-head{display:flex;justify-content:space-between;gap:10px}.map-popover h4{margin:0;font-size:14px}.map-popover p{margin:4px 0 0;color:#6a7688;font-size:11px}.map-popover-actions{display:flex;gap:7px;margin-top:10px}
.gps-quality{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800}.gps-quality:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.gps-good{color:#16835c}.gps-weak{color:#b7791f}.gps-off{color:#c83f49}

/* Entregador: operação de rua */
.operation-now{background:#101828;color:#fff;border-radius:16px;padding:13px 15px;margin-bottom:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.operation-now small{display:block;color:#9eabc0;font-size:9px;text-transform:uppercase;letter-spacing:.1em}.operation-now strong{font-size:14px}
.courier-stepper{display:flex;align-items:center;gap:0;margin:14px 0 18px}.courier-step{display:flex;align-items:center;flex:1}.courier-step:last-child{flex:0}.courier-step i{width:12px;height:12px;border-radius:50%;background:#dfe5ed;border:3px solid #fff;box-shadow:0 0 0 1px #d4dbe5}.courier-step:after{content:"";height:3px;background:#e2e7ee;flex:1}.courier-step.done i,.courier-step.current i{background:var(--brand);box-shadow:0 0 0 1px var(--brand)}.courier-step.done:after{background:var(--brand)}.courier-step.current i{box-shadow:0 0 0 4px #eaf1ff}
.ticket{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border:1px solid #e0e6ed;border-radius:18px;padding:15px 16px;box-shadow:0 5px 16px rgba(15,23,42,.045)}
.ticket-label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#7b8798}.ticket-number{font-size:36px;font-weight:900;letter-spacing:-.07em;line-height:1;color:#111827}.ticket-ahead{font-size:11px;color:#667085;margin-top:4px}.ticket-mark{width:70px;height:70px;border-radius:20px;background:#111827;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}.ticket-mark small{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#9eabc0}.ticket-mark strong{font-size:27px;line-height:1.05}
.courier-destination{font-size:27px}.street-confidence{display:flex;align-items:flex-start;gap:9px;border-radius:12px;padding:10px 11px;margin-top:7px;font-size:11px}.street-confidence.confirmed{background:#eff9f4;color:#14684d;border:1px solid #d5ecdf}.street-confidence.pending{background:#fff8e8;color:#7d5b08;border:1px solid #f0dfb3}
.big-action.finish{background:var(--success)!important;box-shadow:0 10px 22px rgba(22,131,92,.20)}.big-action.finish:hover{background:#116d4d!important}
.courier-current .danger-zone{margin-top:18px;padding-top:14px;border-top:1px solid #edf0f4}

/* personagem legado refinado */
.duck{width:58px;height:58px;filter:drop-shadow(0 5px 8px rgba(15,23,42,.11))}

/* Assistente de endereço e wizard */
.wizard-stepper{display:flex;gap:6px;margin:15px 0 19px}.wizard-step-pill{flex:1;padding:8px 5px;border-radius:10px;background:#f1f4f8;color:#7a8494;font-size:9.5px;font-weight:800;text-align:center;border:1px solid #e5e9ef}.wizard-step-pill.active{background:#edf3ff;color:#1e56b9;border-color:#d6e3ff}.wizard-step-pill.done{background:#eef8f4;color:#176a50;border-color:#d6ebdf}
.form-step-title{font-size:12px;font-weight:850;color:#344054;margin:0 0 8px}.reference-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.reference-chip{border:1px solid #dde4ec;background:#f8fafc;color:#536173;border-radius:999px;padding:7px 10px;font-size:10.5px}.reference-chip:hover{background:#eef3f9}.wizard-actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.review-card{background:#f8fafc;border:1px solid #e2e7ee;border-radius:14px;padding:14px}.review-card h4{margin:0 0 8px}.review-row{font-size:12px;margin:6px 0;color:#556173}.review-row strong{color:#273244}
.address-insight{margin-top:7px;border-radius:11px;padding:9px 10px;font-size:10.5px;line-height:1.4}.address-insight.ok{background:#eff9f4;border:1px solid #d4ebde;color:#176a4e}.address-insight.warn{background:#fff8e9;border:1px solid #f0dfb2;color:#7b5a0b}.address-alias{display:block;font-weight:800;margin-top:2px}

/* Financeiro como fatura */
.invoice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.invoice-card{background:#fff;border:1px solid #e1e6ed;border-radius:17px;padding:16px;box-shadow:0 5px 17px rgba(15,23,42,.04);position:relative;overflow:hidden}.invoice-card:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:#dfe6ef}.invoice-card.overdue:before{background:var(--critical)}.invoice-card.paid:before{background:var(--success)}.invoice-card h4{margin:0;font-size:13px}.invoice-card .period{font-size:10.5px;color:#7a8494;margin-top:3px}.invoice-total{font-size:25px;font-weight:900;letter-spacing:-.045em;margin:14px 0 3px}.invoice-detail{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:#667085;margin-top:7px}.invoice-actions{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:14px}

/* Bottom navigation nativa */
.bottom-nav{align-items:end}.bottom-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 3px}.bottom-nav button.active{background:transparent;color:#1d4ed8}.bottom-nav button.center{color:#fff}.bottom-nav button.center .bottom-icon{margin-bottom:0}.bottom-nav button.center svg{width:23px;height:23px}.bottom-nav button:not(.center) .bottom-icon{color:inherit}

/* Modal bottom sheet */
.sheet-handle{display:none;width:42px;height:4px;border-radius:99px;background:#d7dde5;margin:0 auto 12px}

/* Splash / sucesso / skeleton */
.splash-screen{min-height:100vh;display:grid;place-items:center;background:#f5f7fb}.splash-inner{text-align:center;animation:fadeUp .28s ease-out}.splash-inner .brand-logo{width:76px;height:76px;margin:0 auto 16px}.splash-inner h1{margin:0;font-size:24px;letter-spacing:-.05em}.splash-inner p{color:#6c788a;font-size:12px;margin:7px 0}.splash-city{font-size:10px;color:#8d97a6;letter-spacing:.06em;text-transform:uppercase;margin-top:16px}
.skeleton-screen{padding:24px}.skeleton-line,.skeleton-card{background:linear-gradient(90deg,#edf1f5 25%,#f8fafc 45%,#edf1f5 65%);background-size:250% 100%;animation:shimmer 1.2s infinite;border-radius:12px}.skeleton-line{height:16px;width:40%;margin-bottom:14px}.skeleton-card{height:110px;margin-bottom:12px}@keyframes shimmer{to{background-position:-250% 0}}
.completion-screen{min-height:55vh;display:grid;place-items:center;text-align:center;padding:30px 10px;animation:fadeUp .2s ease-out}.completion-check{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:#eaf8f2;color:#137153;margin:0 auto 16px}.completion-check svg{width:34px;height:34px}.completion-screen h2{font-size:22px;margin:0}.completion-screen p{color:#687386;line-height:1.5}.completion-ticket{display:inline-block;margin-top:10px;padding:8px 12px;border-radius:11px;background:#111827;color:#fff;font-size:12px}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card,.delivery-box,.alert,.invoice-card{animation:fadeUp .16s ease-out}

/* Tema escuro do admin */
body.admin-dark{--bg:#0b1220;--panel:#111a2b;--panel2:#172235;--text:#edf2f7;--muted:#98a6b8;--line:#263249;background:#0b1220}
.admin-dark .main,.admin-dark .content{background:#0b1220}.admin-dark .topbar{background:rgba(15,23,42,.96);border-color:#263249}.admin-dark .topbar h2,.admin-dark .section-title h3,.admin-dark .card h3,.admin-dark .metric,.admin-dark .table td,.admin-dark .timeline-text{color:#eef2f7}.admin-dark .card,.admin-dark .table-wrap,.admin-dark .table td,.admin-dark .modal,.admin-dark .invoice-card,.admin-dark .queue-node{background:#111a2b;border-color:#27344a;color:#e7edf5}.admin-dark .table th{background:#172235;color:#9aa9bb}.admin-dark .table tbody tr:hover{background:#162033}.admin-dark .kpi-mini,.admin-dark .confirm-box{background:#162033;border-color:#27344a}.admin-dark .topbar-action{background:#172235;border-color:#2b3950;color:#b6c2d2}.admin-dark .status.gray{background:#233048;color:#aebbc9;border-color:#2b3a51}.admin-dark .modal-head,.admin-dark .profile-head{border-color:#263249}.admin-dark .field input,.admin-dark .field select,.admin-dark .field textarea{background:#0f1828;border-color:#2b3950;color:#eef2f7}.admin-dark .row-menu{background:#172235;border-color:#2b3950;color:#c1ccda}.admin-dark .empty{color:#9aa7b7}.admin-dark .empty strong{color:#e8eef5}.admin-dark .page-description{color:#8795a8}

/* Sol forte: somente experiência do entregador */
body.sun-mode .courier-shell{background:#fff;color:#000}.sun-mode .courier-shell .simple-header{background:#000}.sun-mode .courier-shell .simple-main{background:#fff}.sun-mode .courier-shell .card,.sun-mode .courier-shell .queue-card,.sun-mode .courier-shell .courier-current,.sun-mode .courier-shell .ticket{box-shadow:none;border:2px solid #111}.sun-mode .courier-shell .muted{color:#343434}.sun-mode .courier-shell .courier-destination{font-size:30px;color:#000}.sun-mode .courier-shell .big-action{min-height:64px;font-size:18px}.sun-mode .courier-shell .reference-box{border:2px solid #8a6500;background:#fff4be;color:#000}.sun-mode .courier-shell .bottom-nav{background:#fff;border-top:2px solid #111;box-shadow:none}.sun-mode .courier-shell .operation-now{background:#000}

/* PWA/instalação */
.install-hint{display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid #e1e7ef;background:#f8fafc;border-radius:12px;font-size:11px;color:#5d6879;margin-top:12px}

@media(max-width:700px){
  .sheet-handle{display:block}.modal-head{padding-top:0}.simple-header{box-shadow:none}.simple-header .row{align-items:center}.simple-main{padding-left:12px;padding-right:12px}.courier-current{padding:16px}.courier-destination{font-size:25px}.operation-now{margin-top:0}.ticket{padding:14px}.ticket-mark{width:64px;height:64px}.wizard-stepper{position:sticky;top:0;z-index:2;background:var(--bg);padding:5px 0 8px;margin-top:0}.delivery-wizard .form-step{display:none}.delivery-wizard[data-step="1"] .form-step[data-step="1"],.delivery-wizard[data-step="2"] .form-step[data-step="2"],.delivery-wizard[data-step="3"] .form-step[data-step="3"],.delivery-wizard[data-step="4"] .form-step[data-step="4"]{display:block;animation:fadeUp .16s ease-out}.invoice-grid{grid-template-columns:1fr}.bottom-nav{grid-auto-rows:58px}.bottom-nav button{min-height:54px}.bottom-nav button.center{margin-top:-9px}.map-popover{bottom:10px}.cards{grid-template-columns:1fr 1fr}.op-strip{gap:9px;padding:11px 12px}.op-strip .op-dot{display:none}
}
@media(max-width:430px){.invoice-grid{grid-template-columns:1fr}.queue-rail{margin-right:-10px}.wizard-step-pill{font-size:8.5px;padding:7px 3px}.topbar-action{width:36px;height:36px}.page-heading .page-description{max-width:200px}.courier-destination{font-size:24px}}



/* ======================================================================
   ADMIN OFICIAL v3.1 — navegação inferior + painel simplificado
   Mecânica preservada; esta camada altera apenas organização/aparência.
   ====================================================================== */
.admin-shell{min-height:100vh;background:var(--bg);padding-bottom:102px}
.admin-shell .main{min-height:100vh;width:100%;background:var(--bg)}
.admin-shell .topbar{top:0!important;min-height:68px;padding:10px 20px;box-shadow:none;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96)}

/* Navegação administrativa fixa e simples */
.admin-bottom-nav{display:grid!important;grid-template-columns:repeat(5,minmax(74px,1fr));position:fixed;z-index:45;left:50%;right:auto;bottom:12px;transform:translateX(-50%);width:min(690px,calc(100% - 24px));padding:7px 9px calc(7px + env(safe-area-inset-bottom));border:1px solid rgba(218,224,233,.96);border-radius:22px;background:rgba(255,255,255,.97);box-shadow:0 16px 45px rgba(15,23,42,.15);backdrop-filter:blur(18px)}

/* Início administrativo simplificado */
.admin-home{display:grid;gap:18px}

.admin-summary-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #edf0f4}

   v3.1.2 — HIERARQUIA VISUAL MOBILE + CONFIRMAÇÕES OPERACIONAIS

   ====================================================================== */
:root{
  --state-critical:#c93643;--state-critical-bg:#fff0f2;--state-critical-line:#f3c2c8;
  --state-warning:#9a6400;--state-warning-bg:#fff7df;--state-warning-line:#efd99a;
  --state-info:#215fc7;--state-info-bg:#edf4ff;--state-info-line:#cadcff;

/* Títulos com hierarquia visível */
.admin-shell .topbar h2{color:#142033;font-weight:900}

.admin-summary-item{position:relative;isolation:isolate}
.admin-summary-item:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#d7dee8}
.admin-summary-item.waiting.has-value{background:var(--state-critical-bg)}
.admin-summary-item.waiting.has-value:before{background:var(--state-critical)}
.admin-summary-item.waiting.has-value strong{color:var(--state-critical)}

/* ======================================================================

body:not(.admin-dark){--admin-bg:#f4f6f8;--admin-surface:#ffffff;--admin-surface-2:#f8fafb;--admin-border:#e3e8ee;--admin-title:#152033;--admin-muted:#697586;--admin-blue:#2563eb;--admin-red:#c93643;--admin-amber:#b87912;--admin-green:#147456}

/* Estrutura da central operacional. */
.ops-console{display:grid;gap:18px}
.ops-panel{background:#fff;border:1px solid #e2e7ed;border-radius:16px;box-shadow:none;overflow:hidden}
.ops-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:16px 17px 13px;border-bottom:1px solid #edf0f3}

.admin-delivery-row{display:grid;grid-template-columns:80px minmax(190px,1.25fr) minmax(170px,1fr) 140px 115px 78px;gap:12px;align-items:center;padding:13px 15px;border-bottom:1px solid #edf0f3;position:relative}

/* ======================================================================
   v3.2 — produto mais sólido: superfícies, ritmo e movimento discreto
   ====================================================================== */
:root{--product-ink:#142033;--product-muted:#687689;--product-border:#dde4ec;--product-page:#f4f6f9;--product-blue:#2563eb;--product-navy:#111b2e;--product-green:#147456;--product-amber:#a96808;--product-red:#b93844}
body{background:var(--product-page)}
.merchant-shell,.courier-shell{background:var(--product-page)}
.merchant-shell .simple-main,.courier-shell .simple-main{max-width:960px}
.merchant-shell .simple-header{border-bottom:3px solid #f2c94c;box-shadow:0 1px 0 rgba(255,255,255,.08)}
.merchant-shell .action-card.merchant-hero{background:var(--product-navy)!important;border:1px solid #1e2b42;box-shadow:0 10px 26px rgba(15,23,42,.11)!important}
.merchant-shell .action-card.merchant-hero:before,.merchant-shell .action-card.merchant-hero:after{display:none}
.card,.delivery-box,.queue-card,.courier-current,.invoice-card{border-color:var(--product-border)}
.delivery-box.v3{box-shadow:none;border-radius:17px;background:#fff;transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease}
.delivery-box.v3:hover{border-color:#c9d5e4;box-shadow:0 8px 18px rgba(15,23,42,.06);transform:translateY(-1px)}
.bottom-nav,.admin-bottom-nav{backdrop-filter:blur(16px)}
.btn,.bottom-nav button,.admin-bottom-nav button,.merchant-more-link,.delivery-detail-link{transition:transform .16s ease,background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease}
.btn:active,.bottom-nav button:active,.admin-bottom-nav button:active,.merchant-more-link:active{transform:scale(.975)}
.btn.primary{background:#2563eb;box-shadow:0 7px 16px rgba(37,99,235,.18)}
.btn.primary:hover{background:#1d56d1;box-shadow:0 9px 20px rgba(37,99,235,.23)}
.progress-fill{animation:progressSettle .55s cubic-bezier(.22,1,.36,1) both}
.modal-back{background:rgba(15,23,42,.46);backdrop-filter:blur(3px)}
.modal{box-shadow:0 22px 58px rgba(15,23,42,.22);animation:modalArrive .2s cubic-bezier(.22,1,.36,1)}
.toast{box-shadow:0 12px 30px rgba(15,23,42,.19);animation:toastArrive .22s cubic-bezier(.22,1,.36,1)}
.merchant-shell,.courier-shell,.admin-shell{animation:pageArrive .26s cubic-bezier(.22,1,.36,1)}

/* Financeiro do comerciante */
.finance-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;border-radius:21px;background:var(--product-navy);padding:23px 24px;color:#fff;border:1px solid #1c2b43;box-shadow:0 12px 28px rgba(15,23,42,.12)}
.finance-kicker{display:block;color:#a8c7ff;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px}.finance-hero h2{margin:0;font-size:23px;letter-spacing:-.045em;max-width:570px}.finance-hero p{margin:8px 0 0;color:#c4cfdf;font-size:12px;line-height:1.5;max-width:590px}.finance-hero-total{display:grid;gap:5px;justify-items:end;min-width:150px}.finance-hero-total span{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#a9bdd9;font-weight:800}.finance-hero-total strong{font-size:25px;letter-spacing:-.045em;white-space:nowrap}.finance-hero .btn.light{margin-top:5px;background:#fff;border:0;color:#18366c;box-shadow:none}.finance-hero .btn.light:hover{background:#eef4ff}
.finance-notice-stack{display:grid;gap:8px;margin-top:14px}.finance-notice{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid #dce5ee;background:#fff;padding:11px 12px;border-radius:14px}.finance-notice>span{width:27px;height:27px;display:grid;place-items:center;border-radius:9px;font-weight:950}.finance-notice.urgent{border-color:#f0d2d6;background:#fff9f9}.finance-notice.urgent>span{color:#a92d3b;background:#ffeaed}.finance-notice.soon{border-color:#f1e1b3;background:#fffdf7}.finance-notice.soon>span{color:#8b5a00;background:#fff1c8}.finance-notice strong{font-size:11.5px;color:var(--product-ink)}.finance-notice p{font-size:10.5px;color:var(--product-muted);margin:3px 0 0;line-height:1.35}
.finance-section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:22px 2px 10px}.finance-section-head h3{margin:0;color:var(--product-ink);font-size:17px;letter-spacing:-.03em}.finance-section-head p{margin:4px 0 0;color:var(--product-muted);font-size:10.5px}.finance-section-head>span{color:#718096;font-size:10px;font-weight:850;background:#eaf0f7;border-radius:999px;padding:6px 9px;white-space:nowrap}
.merchant-invoice-list{display:grid;gap:9px}.merchant-invoice{background:#fff;border:1px solid var(--product-border);border-radius:16px;padding:14px 15px;position:relative;overflow:hidden;animation:cardArrive .26s ease both}.merchant-invoice:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:99px;background:#9ba9b9}.merchant-invoice.state-red:before{background:var(--product-red)}.merchant-invoice.state-amber:before{background:#c68919}.merchant-invoice.state-green:before{background:var(--product-green)}.merchant-invoice-main{display:flex;align-items:start;justify-content:space-between;gap:12px;padding-left:5px}.invoice-id{display:block;font-size:9px;color:#78869a;font-weight:900;letter-spacing:.1em}.merchant-invoice h4{font-size:20px;letter-spacing:-.04em;color:var(--product-ink);margin:5px 0 3px}.merchant-invoice p{font-size:10.5px;color:var(--product-muted);margin:0}.merchant-invoice-meta{display:flex;justify-content:space-between;gap:12px;padding:11px 5px 0;font-size:10.5px;color:#6d7a8c}.proof-state{color:#986100;font-weight:800}.merchant-invoice-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:12px;padding-top:11px;border-top:1px solid #edf1f5}.merchant-invoice-actions .btn{min-height:34px}
.payment-checkout{display:grid;gap:14px}.payment-checkout-total{border:1px solid #dae4f1;background:#f6f9fd;border-radius:16px;padding:15px 16px}.payment-checkout-total span,.payment-checkout-total small{display:block;color:#69778a;font-size:10px}.payment-checkout-total span{font-weight:850;text-transform:uppercase;letter-spacing:.08em}.payment-checkout-total strong{display:block;color:#142033;font-size:27px;letter-spacing:-.05em;margin:5px 0}.payment-method-picker{display:grid;gap:8px}.payment-method-choice,.payment-method-disabled{width:100%;display:grid;grid-template-columns:35px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;border:1px solid #e0e6ee;border-radius:14px;background:#fff;padding:10px 11px;color:#263447}.payment-method-choice:hover{border-color:#b9ccec;background:#f8fbff}.payment-method-choice.active{border-color:#8db1f4;background:#eef5ff;box-shadow:inset 3px 0 0 #2563eb}.payment-method-symbol,.payment-method-disabled>span:first-child{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:10px;font-weight:950;background:#e4eeff;color:#2258bb}.payment-method-choice strong,.payment-method-disabled strong{display:block;font-size:11.5px}.payment-method-choice small,.payment-method-disabled small{display:block;font-size:9.5px;color:#758195;margin-top:2px}.payment-method-choice b{font-size:18px;font-weight:500;color:#728096}.payment-method-disabled{opacity:.58;background:#fafbfd}.payment-method-disabled>span:first-child{background:#eef0f3;color:#788494}.payment-detail{display:flex;align-items:start;justify-content:space-between;gap:12px;border:1px solid #dce7f6;border-radius:14px;padding:12px 13px;background:#f8fbff}.payment-detail strong{font-size:11.5px;color:#1c3f79}.payment-detail p{font-size:10.5px;color:#4e6080;line-height:1.42;margin:4px 0}.payment-detail small{display:block;font-size:9.5px;line-height:1.35;color:#6a7c98}.payment-detail.compact{display:block;margin-top:12px;background:#fffaf0;border-color:#f1dfb2}.payment-detail.compact strong{color:#7c5600}.payment-note{margin:0}.payment-settings-note{font-size:11px;line-height:1.45;color:#5f6d7e;background:#f7f9fb;border:1px solid #e3e9f0;padding:11px 12px;border-radius:12px;margin-bottom:13px}.charge-detail-top{padding:4px 0 3px}.charge-detail-top>strong{display:block;margin-top:10px;font-size:27px;letter-spacing:-.05em}.charge-detail-top p{font-size:11px;color:var(--product-muted);margin:5px 0}

/* Financeiro da Administração */

/* ======================================================================

.duck-story-top{position:relative;padding:28px 28px 13px;text-align:center;background:linear-gradient(180deg,var(--duck-soft),#fff 92%);overflow:hidden}
.duck-story-top:before,.duck-story-top:after{content:"";position:absolute;border-radius:50%;pointer-events:none;opacity:.34}.duck-story-top:before{width:180px;height:180px;right:-100px;top:-100px;background:var(--duck-accent)}.duck-story-top:after{width:100px;height:100px;left:-50px;bottom:-58px;background:var(--duck-accent2)}

.duck-story-art-wrap{position:relative;margin:3px 22px 0;border-radius:25px;overflow:hidden;background:var(--duck-soft);border:1px solid rgba(39,82,145,.09);box-shadow:0 12px 30px rgba(22,53,92,.09)}
.duck-story-art{display:block;width:100%;height:275px;object-fit:cover;object-position:center}

.duck-story-spark{position:absolute;z-index:2;font-size:22px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.09));animation:duckSpark 1.9s ease-in-out infinite alternate}.duck-story-spark.s1{left:8%;top:11%}.duck-story-spark.s2{right:9%;top:24%;animation-delay:.4s}.duck-story-spark.s3{right:18%;bottom:9%;animation-delay:.75s}
@keyframes duckSpark{from{transform:translateY(0) rotate(-7deg) scale(.94)}to{transform:translateY(-5px) rotate(7deg) scale(1.06)}}
.duck-story-content{padding:16px 24px 7px}.duck-story-note{padding:12px 14px;border-radius:15px;background:var(--duck-soft);border:1px solid color-mix(in srgb,var(--duck-accent) 18%,#fff);font-size:12.5px;line-height:1.45;color:#425775;text-align:center}.duck-story-note strong{color:inherit}
.duck-story-extra{margin-top:12px}.duck-story-metas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.duck-story-meta{padding:11px 8px;text-align:center;border:1px solid #e3eaf3;background:#fff;border-radius:14px}.duck-story-meta small{display:block;color:#7b899e;font-size:9px;text-transform:uppercase;letter-spacing:.07em;font-weight:800}.duck-story-meta strong{display:block;margin-top:3px;font-size:15px;color:#122b50}
.duck-story-field{margin-top:12px;text-align:left}.duck-story-field label{display:block;margin-bottom:6px;color:#34445c;font-size:12px;font-weight:800}.duck-story-field textarea{width:100%;min-height:84px;resize:vertical;border:1px solid #d7e0ec;border-radius:13px;padding:11px 12px;outline:none}.duck-story-field textarea:focus{border-color:var(--duck-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--duck-accent) 13%,transparent)}

.duck-story-brand{padding:7px 20px 20px;text-align:center;color:#174b99;font-size:13px;font-weight:950;letter-spacing:.02em}.duck-story-brand b{color:#f1a900}.duck-story-brand span{display:block;margin-top:1px;color:#8793a3;font-size:8px;letter-spacing:.17em;text-transform:uppercase}
.duck-story-toast{display:flex;align-items:center;gap:10px}.duck-story-toast img{width:48px;height:48px;object-fit:cover;border-radius:13px;border:2px solid rgba(255,255,255,.25)}

/* ==========================================================================
   OAF ENTREGAS — DESIGN SYSTEM OFICIAL v3.4.0
   Identidade Visual Expandida · camada final de autoridade visual.
   As camadas anteriores permanecem apenas por compatibilidade estrutural.
   ========================================================================== */
:root{
  --el-blue:#1864F2;
  --el-blue-strong:#0F55DD;
  --el-blue-dark:#0D2B66;
  --el-blue-soft:#EDF4FF;
  --el-yellow:#FFC107;
  --el-yellow-soft:#FFF8DF;
  --el-white:#FFFFFF;
  --el-gray-50:#F8FAFF;
  --el-gray-100:#F1F3F6;
  --el-gray-200:#D9E1EC;
  --el-gray-300:#C7D2E2;
  --el-text:#0D2B66;
  --el-body:#263A5B;
  --el-muted:#6C7B91;
  --el-red:#EF4444;
  --el-red-soft:#FEF2F2;
  --el-green:#22C55E;
  --el-green-soft:#ECFDF5;
  --el-gold:#D4A017;
  --el-gold-soft:#FFF8E1;

  --radius-xs:8px;
  --radius-sm:12px;
  --radius-md:16px;
  --radius-lg:20px;
  --radius-xl:24px;
  --radius-popup:28px;
  --radius-full:999px;

  --shadow-1:0 4px 14px rgba(13,43,102,.06);
  --shadow-2:0 10px 30px rgba(13,43,102,.10);
  --shadow-3:0 24px 70px rgba(13,43,102,.18);

  /* aliases usados pela base */
  --bg:var(--el-gray-50);
  --panel:var(--el-white);
  --panel2:var(--el-gray-100);
  --text:var(--el-text);
  --muted:var(--el-muted);
  --line:#E2E9F3;
  --primary:var(--el-blue);
  --primary2:var(--el-blue-strong);
  --blue:var(--el-blue);
  --dark:var(--el-blue-dark);
  --yellow:var(--el-yellow);
  --green:var(--el-green);
  --red:var(--el-red);
  --amber:#E59B00;
  --brand:var(--el-blue);
  --brand-strong:var(--el-blue-strong);
  --brand-soft:var(--el-blue-soft);
  --navy:var(--el-blue-dark);
  --navy-2:#173B77;
  --success:var(--el-green);
  --warning:#D99000;
  --critical:var(--el-red);
  --surface:#fff;
  --surface-soft:var(--el-gray-50);
  --product-blue:var(--el-blue);
  --product-navy:var(--el-blue-dark);
  --product-yellow:var(--el-yellow);
  --product-green:var(--el-green);
  --product-red:var(--el-red);
  --product-ink:var(--el-text);
  --product-muted:var(--el-muted);
  --product-border:#E2E9F3;
  --shadow:var(--shadow-2);
  --shadow-soft:var(--shadow-1);
  --shadow-float:var(--shadow-3);
  --radius:var(--radius-lg);
  --radius2:var(--radius-sm);
}
html{background:var(--el-gray-50)}
html,body{
  color:var(--el-body);
  background:var(--el-gray-50);
  font-family:"Poppins",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
h1,h2,h3,h4,.metric,.ticket-number,.queue-number{color:var(--el-blue-dark)}
::selection{background:#DCE9FF;color:var(--el-blue-dark)}
:focus-visible{outline:3px solid rgba(24,100,242,.24);outline-offset:2px}
a,button,input,select,textarea{touch-action:manipulation}

/* MARCA */
.brand-logo{filter:drop-shadow(0 7px 14px rgba(24,100,242,.16))}
.brand h1{color:var(--el-blue-dark);font-weight:850}
.brand-wordmark{display:inline-flex;align-items:baseline;gap:5px;font-size:27px;font-weight:900;letter-spacing:-.05em;line-height:1}
.brand-wordmark .brand-entrega{color:var(--el-blue-dark)}

.brand-slogan{margin-top:5px;color:#536986;font-size:11.5px;font-weight:650}
.brand p,.login-slogan{color:var(--el-muted)}
.city-signature{color:var(--el-muted)}
.splash-inner .brand-logo{filter:drop-shadow(0 12px 24px rgba(0,0,0,.14))}

/* LOGIN */
.login-wrap{
  min-height:100dvh;
  padding:20px;
  background:
    radial-gradient(circle at 12% 10%,rgba(24,100,242,.13),transparent 29%),
    radial-gradient(circle at 89% 86%,rgba(255,193,7,.18),transparent 28%),
    linear-gradient(145deg,#F9FBFF 0%,#F1F6FF 55%,#FFFDF5 100%)!important;
}
.login-card{
  width:min(440px,100%);
  border:1px solid rgba(217,225,236,.95)!important;
  border-top:5px solid var(--el-yellow)!important;
  border-radius:var(--radius-popup)!important;
  padding:30px!important;
  background:rgba(255,255,255,.97)!important;

/* CAMPOS */
.field{gap:7px}

.field input,.field select,.field textarea,.searchbar input,.searchbar select{
  min-height:46px;

  border:1px solid var(--el-gray-200)!important;
  border-radius:13px!important;
  box-shadow:0 1px 2px rgba(13,43,102,.025);

.field input:hover,.field select:hover,.field textarea:hover,.searchbar input:hover,.searchbar select:hover{border-color:#B8C7DB!important}
.field input:focus,.field select:focus,.field textarea:focus,.searchbar input:focus,.searchbar select:focus{
  border-color:var(--el-blue)!important;
  box-shadow:0 0 0 4px rgba(24,100,242,.11)!important;

}
::placeholder{color:#97A5B8}

/* BOTÕES */
.btn,.big-action,.duck-story-btn{
  border-radius:14px!important;
  font-weight:800!important;
  letter-spacing:-.012em;
}
.btn{min-height:43px}
.btn.primary,.big-action,.bottom-nav button.center,.nav .special{
  color:#fff!important;
  background:linear-gradient(180deg,#2470F8 0%,var(--el-blue) 100%)!important;
  border-color:var(--el-blue)!important;
  box-shadow:0 9px 22px rgba(24,100,242,.22)!important;
}
.btn.primary:hover,.big-action:hover,.nav .special:hover{background:var(--el-blue-strong)!important}
.btn.ghost,.btn.outline{
  color:var(--el-blue)!important;
  background:#fff!important;
  border:1.5px solid #BFD2F5!important;
  box-shadow:none!important;
}
.btn.ghost:hover,.btn.outline:hover{background:var(--el-blue-soft)!important;border-color:var(--el-blue)!important}
.btn.success{background:var(--el-green-soft)!important;color:#11833E!important;border:1px solid #BDEACB!important}
.btn.warn{background:var(--el-yellow-soft)!important;color:#795A00!important;border:1px solid #F6D865!important}
.btn.danger{background:var(--el-red-soft)!important;color:#B4232F!important;border:1px solid #F7C9CE!important}
.btn:disabled,.big-action:disabled{opacity:.48!important;box-shadow:none!important}
.big-action{min-height:58px!important;font-size:16px!important;text-transform:none}

.card,.delivery-box,.queue-card,.courier-current,.ticket,.invoice-card,.merchant-invoice,
.table-wrap,.perm-group,.kpi-mini,.admin-ref-queue-card,.admin-ref-metric,.merchant-more-link,

.card:hover,.delivery-box:hover{transform:none!important;box-shadow:var(--shadow-1)!important}

.status{
  min-height:27px;

}

}

.duck-story-content{padding:14px 20px 6px!important}

}
.duck-story-meta,.duck-assignment-meta>div{

}

}

/* ENTREGA ATRIBUÍDA — popup obrigatório e sem ação de recusa */
.duck-story-back.assignment-fullscreen{

}
.duck-story-modal.fullscreen-assignment{
  width:min(560px,100%)!important;

}

}

/* TOASTS */
.toast{

}
.toast.success{background:#14823F!important}
.toast.error{background:#B52D3A!important}

/* BLOQUEIO FINANCEIRO */
.locked{background:rgba(248,250,255,.97)!important}
.locked-card{border-top:5px solid var(--el-yellow)!important;border-radius:26px!important;box-shadow:var(--shadow-3)!important}

/* MAPA */
.map{background:#EEF4F8!important;border-color:#DDE6EE!important}

/* SOL FORTE — preserva recurso, reforçando contraste sem trocar identidade */

.sun-mode .big-action,.courier-shell.sun-mode .big-action{box-shadow:0 0 0 2px #fff,0 0 0 5px var(--el-blue)!important}

/* ADMIN DARK — preserva recurso sem neon */

/* ADMIN DESKTOP — sidebar institucional; bottom nav permanece para tablet/celular */

  grid-template-columns:264px minmax(0,1fr);

  position:sticky;top:0;height:100vh;z-index:35;

.admin-desktop-sidebar .nav button.active{

}

.admin-side-foot{

.admin-side-foot strong{display:block;color:#fff;font-size:12.5px}

.admin-layout-v340>.main{min-width:0}
.admin-layout-v340 .admin-bottom-nav{display:none!important}

@media(max-width:980px){

    left:8px!important;right:8px!important;bottom:7px!important;
    transform:none!important;width:auto!important;height:auto!important;
    border-radius:22px!important;
  }
}

/* ======================================================================
   OAF ENTREGAS — IDENTIDADE VISUAL OFICIAL v3.5.0
   Camada exclusivamente visual. Regras de fila, atribuição e estados
   permanecem na implementação funcional original.
   ====================================================================== */
:root{
  --oaf-blue:#0D47A1;--oaf-blue-2:#1565C0;--oaf-navy:#0A2E6D;--oaf-deep:#071C45;
  --oaf-yellow:#FFC107;--oaf-bg:#F5F7FA;--oaf-panel:#FFFFFF;--oaf-line:#DDE5EF;
  --oaf-text:#0D2145;--oaf-muted:#64748B;--oaf-success:#22C55E;--oaf-info:#3B82F6;
  --oaf-warn:#F59E0B;--oaf-danger:#EF4444;--oaf-neutral:#64748B;
  --primary:var(--oaf-blue-2);--primary2:var(--oaf-blue);--dark:var(--oaf-navy);
  --green:#16A05F;--red:#D93445;--amber:#B87300;--blue:var(--oaf-blue-2);
  --bg:var(--oaf-bg);--panel:#fff;--panel2:#EFF4FA;--text:var(--oaf-text);--muted:var(--oaf-muted);--line:var(--oaf-line);
  --shadow:0 18px 50px rgba(7,28,69,.10);--radius:20px;--radius2:14px;
}
html,body{font-family:"Poppins","Segoe UI",Arial,sans-serif;background:var(--oaf-bg);color:var(--oaf-text)}
body{background-image:radial-gradient(circle at 8% 2%,rgba(21,101,192,.055),transparent 24%),radial-gradient(circle at 95% 100%,rgba(255,193,7,.06),transparent 25%)}
.btn{border-radius:13px;font-weight:800;min-height:44px}
.btn.primary,.big-action{background:linear-gradient(180deg,#176CE0 0%,#0D55C7 100%);box-shadow:0 10px 24px rgba(13,71,161,.22)}
.btn.primary:hover,.big-action:hover{background:linear-gradient(180deg,#1262D3,#0B49AF)}
.btn.success{background:#E9F9F0;color:#087443;border:1px solid #BCEBD0}
.btn.warn{background:#FFF6DD;color:#8A5B00;border:1px solid #F3D98C}
.btn.danger{background:#FFF0F1;color:#B52335;border:1px solid #F0BEC4}
.btn.ghost{background:#F1F5FA;color:#29405F}.btn.outline{border:1.5px solid #C8D7EB;color:#0D55C7;background:#fff}
.card,.delivery-box,.courier-current,.queue-card{border-color:#DFE7F1;box-shadow:0 8px 24px rgba(10,46,109,.055)}
.status{font-weight:800;border:1px solid transparent}.status.green{background:#EAF9F0;color:#0D7B48;border-color:#C7EED8}.status.blue{background:#EDF4FF;color:#1556BC;border-color:#D3E3FF}.status.amber{background:#FFF6DD;color:#9A6200;border-color:#F5E1A5}.status.red{background:#FFF0F1;color:#BB2638;border-color:#F3C7CC}.status.gray{background:#F1F4F8;color:#64748B;border-color:#E2E8F0}

/* Marca */
.brand-logo{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,#0D47A1,#062E76);box-shadow:0 8px 22px rgba(7,28,69,.18);overflow:hidden;flex:0 0 auto}
.brand-logo.sm{width:42px;height:42px;border-radius:13px}.brand-logo img{width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.12))}
.oaf-full-logo{display:block;max-width:100%;height:auto;object-fit:contain}.oaf-brand-lockup{display:flex;align-items:center;justify-content:center;min-height:92px}.oaf-brand-lockup img{width:min(310px,84vw)}
.oaf-admin-avatar{display:grid;place-items:center;width:100%;height:100%;border-radius:inherit;background:linear-gradient(145deg,#1565C0,#0A2E6D);color:#fff;font-weight:900;font-size:22px}

/* Login — mobile first */
.login-wrap{padding:20px 14px;background:linear-gradient(160deg,#0A2E6D 0%,#0D47A1 36%,#EDF4FF 36%,#F8FAFD 100%);min-height:100svh;align-items:center}
.login-wrap:before{content:"";position:absolute;left:-95px;top:8%;width:230px;height:230px;border-radius:50%;border:1px solid rgba(255,255,255,.10)}
.login-card{width:min(430px,100%);padding:24px 22px 22px;border-radius:26px;background:rgba(255,255,255,.98);border:1px solid rgba(255,255,255,.76);box-shadow:0 26px 70px rgba(7,28,69,.22)}
.login-card .brand{display:block;text-align:center;margin:0 0 12px}.login-card .brand-logo{display:none}
.oaf-login-hero{position:relative;display:grid;grid-template-columns:1fr 92px;align-items:end;gap:8px;padding:16px 16px 0;margin:-2px -2px 18px;border-radius:20px;background:linear-gradient(135deg,#0A2E6D,#0D47A1);color:#fff;overflow:hidden}
.oaf-login-hero:before{content:"";position:absolute;inset:auto -25px -55px auto;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.oaf-login-copy{position:relative;padding-bottom:16px}.oaf-login-copy strong{display:block;font-size:20px;letter-spacing:-.03em}.oaf-login-copy span{font-size:12px;color:#D8E7FF}.oaf-login-character{position:relative;width:92px;height:116px;object-fit:contain;object-position:bottom;filter:drop-shadow(0 8px 12px rgba(0,0,0,.18))}
.login-slogan{background:#F1F6FD!important;color:#38506E!important;border:1px solid #DFE9F6!important;font-size:13px!important}
.login-card .field input{border-color:#D8E2EF;min-height:50px}.login-card .btn.primary{background:linear-gradient(180deg,#FFD236,#FFC107);color:#152A4F;box-shadow:0 8px 20px rgba(255,193,7,.24)}
.login-card .btn.primary:hover{background:#FFC107}.login-card .btn.ghost{background:#F5F8FC;color:#0D55C7;border:1px solid #DCE6F2}
.city-signature{color:#64748B}.pwa-login-note{display:none!important}

/* Cabeçalhos */
.simple-header{background:linear-gradient(135deg,#08245A,#0D47A1);border-bottom:3px solid #FFC107;box-shadow:0 8px 28px rgba(7,28,69,.16)}
.simple-header h1{font-weight:800;letter-spacing:-.02em}.simple-header p{color:#D3E4FF}
.topbar{border-bottom-color:#E2E9F2}.topbar.home-ref{border-bottom:3px solid #FFC107}.admin-greeting h1{color:#0A2E6D}
.admin-desktop-sidebar{background:linear-gradient(180deg,#061C44 0%,#0A2E6D 54%,#071C45 100%)!important}.admin-side-create{background:linear-gradient(180deg,#176CE0,#0D55C7)!important}.admin-side-brand strong{letter-spacing:.02em}.admin-side-brand small{color:#AFC7E9!important}
.admin-profile-orb{background:linear-gradient(145deg,#176CE0,#0A2E6D)!important;border:3px solid #fff!important;box-shadow:0 7px 20px rgba(7,28,69,.16)!important}

/* Admin */
.admin-ref-home{max-width:960px}.admin-ref-hero{background:linear-gradient(135deg,#0A2E6D,#0D47A1)!important;color:#fff!important;border:0!important;box-shadow:0 16px 38px rgba(7,28,69,.16)!important;min-height:156px!important}
.admin-ref-hero h2,.admin-ref-hero p{color:#fff!important}.admin-ref-hero p{opacity:.82}.admin-ref-hero-art{background:rgba(255,255,255,.09)!important;border:1px solid rgba(255,255,255,.13)!important}.admin-ref-hero .brand-logo{background:rgba(255,255,255,.96)}
.admin-summary-grid .admin-summary-item{border:1px solid #DFE7F1!important;background:#fff!important}.admin-summary-item:before{height:4px!important}.admin-empty-quiet{border-left-color:#22C55E!important}.admin-section h3{color:#0A2E6D}

/* Avatar humano OAF */
.official-avatar-wrap,.oaf-courier-avatar-wrap{display:inline-grid;place-items:center;overflow:hidden;background:#F4F8FD;border:1px solid #D8E4F2;border-radius:18px;flex:0 0 auto}
.official-avatar-wrap{width:54px;height:54px}.oaf-courier-avatar{width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block;filter:none}.duck{width:54px!important;height:54px!important;filter:none!important}.admin-raiz-avatar{overflow:hidden;background:#F4F8FD!important}.admin-raiz-avatar .oaf-courier-avatar{width:100%;height:100%}.admin-profile-avatar{width:100%;height:100%;object-fit:cover}
.profile-head .official-avatar-wrap{width:72px;height:72px}.queue-section .official-avatar-wrap,.admin-ref-queue-row .official-avatar-wrap{border-radius:50%}

/* Entregador */
.courier-shell{background:linear-gradient(180deg,#EDF4FF 0,#F5F7FA 220px,#F5F7FA 100%)}

/* ======================================================================
   OAF ENTREGAS — ETAPA 2 / FUNDAÇÃO VISUAL + LOGIN + ESTRUTURA MOBILE
   Esta camada é estritamente visual. Nenhuma regra operacional é alterada.
   ====================================================================== */
:root{
  --oaf-navy:#0A2E6D;
  --oaf-blue:#0D47A1;
  --oaf-blue-main:#1565C0;
  --oaf-blue-bright:#1F6FE5;
  --oaf-yellow:#FFC107;
  --oaf-white:#FFFFFF;
  --oaf-bg:#F5F7FA;
  --oaf-line:#DDE6F1;
  --oaf-text:#10213F;
  --oaf-muted:#64748B;
  --oaf-success:#22C55E;
  --oaf-info:#2563EB;
  --oaf-attention:#F59E0B;
  --oaf-alert:#EF4444;
  --oaf-neutral:#64748B;
  --oaf-radius-xs:10px;
  --oaf-radius-sm:14px;
  --oaf-radius-md:18px;
  --oaf-radius-lg:24px;
  --oaf-shadow-card:0 8px 26px rgba(10,46,109,.08);
  --oaf-shadow-float:0 18px 48px rgba(7,28,69,.18);
}
html{background:var(--oaf-bg)}
html,body{min-height:100%;overscroll-behavior-y:none}
body{
  background:var(--oaf-bg)!important;
  color:var(--oaf-text)!important;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",Roboto,Arial,sans-serif!important;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font-family:inherit}
button{touch-action:manipulation}
.app{min-height:100dvh;background:var(--oaf-bg)}

/* Componentes globais oficiais */
.card,.delivery-box,.queue-card,.courier-current,.table-wrap,.perm-group,.kpi-mini{
  border-color:var(--oaf-line)!important;
}
.card,.delivery-box,.queue-card,.courier-current{
  border-radius:var(--oaf-radius-md)!important;
  box-shadow:var(--oaf-shadow-card)!important;
}
.btn{border-radius:13px!important;font-weight:800!important;letter-spacing:-.01em}
.btn.primary,.big-action,.bottom-nav button.center{
  background:var(--oaf-blue-main)!important;color:#fff!important;
}
.btn.primary:hover,.big-action:hover{background:var(--oaf-blue)!important}
.btn.outline{background:#fff!important;border:1.5px solid #C9D7EA!important;color:var(--oaf-blue)!important}
.btn.ghost{background:#F2F6FB!important;color:#28405F!important}
.btn.success{background:#EAF8EF!important;color:#087443!important}
.btn.warn{background:#FFF5D8!important;color:#8A5B00!important}
.btn.danger{background:#FFF0F1!important;color:#B62C3B!important}
.status.green{background:#EAF8EF!important;color:#087443!important;border-color:#CFEEDB!important}
.status.blue{background:#EAF2FF!important;color:#0D55C7!important;border-color:#D2E2FA!important}
.status.amber{background:#FFF5D8!important;color:#8A5B00!important;border-color:#F4DFA8!important}
.status.red{background:#FFF0F1!important;color:#B62C3B!important;border-color:#F3D1D6!important}
.status.gray{background:#F0F3F7!important;color:#64748B!important;border-color:#E0E6ED!important}
.field label{color:#29415F!important;font-weight:800!important}
.field input,.field select,.field textarea{
  border:1.5px solid #D8E3F0!important;background:#fff!important;border-radius:14px!important;
  min-height:48px!important;color:var(--oaf-text)!important;
}
.field input:focus,.field select:focus,.field textarea:focus{

}

/* Marca oficial */
.oaf-brand-lockup{display:flex!important;align-items:center;justify-content:center;width:100%}
.oaf-full-logo{display:block;width:min(322px,100%);height:auto;object-fit:contain}

/* LOGIN — tela única para todos os perfis */
.login-wrap{
  min-height:100dvh!important;display:flex!important;align-items:center!important;justify-content:center!important;

.login-card{

.oaf-login-copy{position:relative;z-index:2;display:grid;gap:6px;color:#fff}
.oaf-login-copy strong{font-size:22px;line-height:1.02;letter-spacing:-.035em;font-weight:900}

.admin-v5-metric .row{display:flex;align-items:center;justify-content:space-between;gap:10px}.admin-v5-metric .ico{width:38px;height:38px;border-radius:12px;background:var(--metric-soft,#EDF4FF);color:var(--metric,#1565CC);display:grid;place-items:center}.admin-v5-metric .ico svg{width:21px;height:21px}.admin-v5-metric strong{font-size:34px;color:#072F6B;letter-spacing:-.06em;line-height:1}.admin-v5-metric span{display:block;margin-top:18px;font-size:12px;font-weight:800;color:#173C70;line-height:1.25}.admin-v5-metric small{display:block;margin-top:3px;color:#7B8796;font-size:10.5px}

.admin-v5-section{margin-top:22px}.admin-v5-section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:10px}.admin-v5-section-head h3{margin:0;color:#082F69;font-size:20px;letter-spacing:-.035em}.admin-v5-section-head p{margin:3px 0 0;color:#7A8697;font-size:11.5px}.admin-v5-section-head .btn{min-height:34px}

.admin-v5-shell.has-sidebar .admin-v5-main{margin-left:272px;padding-bottom:0}

/* ======================================================================
   OAF ENTREGAS — ETAPA 6 / ESTADOS GLOBAIS v3.5.5
   Pop-ups, modais, alertas, bloqueios e feedbacks. Somente apresentação.
   ====================================================================== */
:root{
  --oaf6-blue:#0d47a1;--oaf6-blue2:#1556c0;--oaf6-yellow:#ffc107;
  --oaf6-green:#22a35a;--oaf6-red:#e54445;--oaf6-amber:#f4a900;
  --oaf6-ink:#0d2b5e;--oaf6-muted:#64748b;--oaf6-soft:#f5f7fa;
}
.oaf6-state-back{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:18px;background:rgba(7,18,38,.66);backdrop-filter:blur(8px)}
.oaf6-state{width:min(510px,100%);max-height:92vh;overflow:auto;background:#fff;border:1px solid rgba(255,255,255,.82);border-radius:28px;box-shadow:0 30px 100px rgba(5,18,42,.34);position:relative;padding:22px 22px calc(22px + env(safe-area-inset-bottom))}
.oaf6-state:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;border-radius:28px 28px 0 0;background:var(--oaf6-blue2)}
.oaf6-state.success:before{background:var(--oaf6-green)}.oaf6-state.warning:before{background:var(--oaf6-amber)}.oaf6-state.danger:before{background:var(--oaf6-red)}
.oaf6-state-brand{display:flex;align-items:center;gap:9px;color:var(--oaf6-blue);font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-bottom:17px}.oaf6-state-brand .brand-logo{width:31px;height:31px}
.oaf6-state-close{position:absolute;right:16px;top:16px;width:36px;height:36px;border:0;border-radius:12px;background:#f1f4f8;color:#536176;font-size:23px;line-height:1;display:grid;place-items:center}
.oaf6-state-hero{display:grid;grid-template-columns:62px 1fr;gap:14px;align-items:center;margin-bottom:14px}.oaf6-state-icon{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;background:#edf4ff;color:var(--oaf6-blue2);border:1px solid #dbe9ff}.oaf6-state-icon svg{width:29px;height:29px}.oaf6-state.success .oaf6-state-icon{background:#eaf8f0;color:#168447;border-color:#d5eedf}.oaf6-state.warning .oaf6-state-icon{background:#fff7df;color:#a96b00;border-color:#f4e3a7}.oaf6-state.danger .oaf6-state-icon{background:#fff0f1;color:#c9343a;border-color:#f5d4d6}
.oaf6-state-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:#728198;margin-bottom:4px}.oaf6-state h2{margin:0;color:var(--oaf6-ink);font-size:23px;line-height:1.08;letter-spacing:-.035em}.oaf6-state-copy{margin:7px 0 0;color:#536176;font-size:13px;line-height:1.5}
.oaf6-state-body{display:grid;gap:10px;margin-top:16px}.oaf6-state-note{border-radius:15px;padding:12px 13px;background:#f5f8fc;border:1px solid #e4eaf2;color:#526176;font-size:12px;line-height:1.45}.oaf6-state.warning .oaf6-state-note{background:#fffbef;border-color:#f3e6b7}.oaf6-state.danger .oaf6-state-note{background:#fff6f7;border-color:#f0d7da}.oaf6-state.success .oaf6-state-note{background:#f2fbf6;border-color:#d7eee1}
.oaf6-state-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.oaf6-state-actions>.btn{flex:1 1 145px;min-height:48px;border-radius:14px}.oaf6-state.danger .oaf6-state-actions>.btn.primary{background:var(--oaf6-red)!important}.oaf6-state.warning .oaf6-state-actions>.btn.primary{background:var(--oaf6-amber)!important;color:#172033!important}
.oaf6-notification-list{display:grid;gap:8px}.oaf6-notification{display:grid;grid-template-columns:38px 1fr auto;align-items:start;gap:10px;padding:11px;border-radius:14px;border:1px solid #e3e9f1;background:#fafcff}.oaf6-notification .nicon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#edf4ff;color:#1556c0}.oaf6-notification .nicon svg{width:19px;height:19px}.oaf6-notification strong{display:block;font-size:12px;color:#20324e}.oaf6-notification p{margin:3px 0 0;font-size:11px;color:#68778b;line-height:1.4}.oaf6-notification.critical{background:#fff6f7;border-color:#f2d2d5}.oaf6-notification.critical .nicon{background:#ffe9eb;color:#cc343b}.oaf6-notification.warning{background:#fffaf0;border-color:#f1e1b3}.oaf6-notification.warning .nicon{background:#fff1c9;color:#9e6800}
.oaf6-network-banner{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:150;width:min(560px,calc(100% - 24px));display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:15px;background:#10213f;color:#fff;box-shadow:0 16px 44px rgba(5,16,39,.28);border:1px solid rgba(255,255,255,.12)}.oaf6-network-banner .ico{width:34px;height:34px;border-radius:11px;background:#e54445;display:grid;place-items:center}.oaf6-network-banner .ico svg{width:18px;height:18px}.oaf6-network-banner strong{display:block;font-size:12px}.oaf6-network-banner span{display:block;margin-top:2px;color:#d8e1ee;font-size:10.5px;line-height:1.35}
.locked .locked-card.oaf6-lock{padding:0;overflow:hidden;border-radius:28px;text-align:left;border:1px solid #e1e7ef;box-shadow:0 28px 85px rgba(5,18,42,.22)}.oaf6-lock-head{padding:22px 22px 18px;background:linear-gradient(145deg,#0d47a1,#1556c0);color:#fff}.oaf6-lock-head.warning{background:linear-gradient(145deg,#a86e00,#d99500)}.oaf6-lock-mark{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.15);display:grid;place-items:center;margin-bottom:13px}.oaf6-lock-mark svg{width:25px;height:25px}.oaf6-lock-head h2{margin:0;font-size:22px;letter-spacing:-.035em}.oaf6-lock-head p{margin:7px 0 0;color:rgba(255,255,255,.82);font-size:12px;line-height:1.45}.oaf6-lock-body{padding:19px 22px 22px}.oaf6-lock-body .metric{color:#0d2b5e}.oaf6-lock-body .btn{min-height:46px;border-radius:13px}
/* generic modals now share the OAF visual language */
.modal{border-radius:24px!important;border:1px solid #e3e8ef!important;box-shadow:0 28px 90px rgba(5,18,42,.28)!important}.modal-head{border-bottom:1px solid #edf1f5!important;padding-bottom:12px!important}.modal-head h3{color:#0d2b5e!important;font-weight:900!important;letter-spacing:-.025em!important}.modal-actions{gap:9px!important}.confirm-box{background:#f5f8fc!important;border-color:#e1e7ef!important;color:#46566d!important}.alert{border-radius:14px!important}.alert.critical{box-shadow:inset 3px 0 0 #e54445}.alert.info{box-shadow:inset 3px 0 0 #1556c0}.alert.success{box-shadow:inset 3px 0 0 #22a35a}
.toast.oaf6-toast{left:auto;right:18px;bottom:18px;max-width:390px;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;background:#10213f!important;border:1px solid rgba(255,255,255,.12);border-radius:15px;padding:11px 13px;box-shadow:0 18px 50px rgba(5,18,42,.30)}.toast.oaf6-toast.success{background:#126b45!important}.toast.oaf6-toast.error{background:#932f35!important}.oaf6-toast-icon{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.13);display:grid;place-items:center}.oaf6-toast-icon svg{width:18px;height:18px}.oaf6-toast strong{display:block;font-size:11px}.oaf6-toast span{display:block;margin-top:2px;font-size:10.5px;line-height:1.35;color:#eef3f8}

let memoryFallback={};
function storageGet(key){try{return window.localStorage.getItem(key)}catch(e){return memoryFallback[key]||null}}
function storageSet(key,value){try{window.localStorage.setItem(key,value);return true}catch(e){memoryFallback[key]=value;return false}}
function storageRemove(key){try{window.localStorage.removeItem(key)}catch(e){delete memoryFallback[key]}}
function loadState(){
  const raw=storageGet(STORAGE_KEY);
  if(!raw){const s=makeSeed();storageSet(STORAGE_KEY,JSON.stringify(s));return s}
  try{return migrateState(JSON.parse(raw))}catch(e){const s=makeSeed();storageSet(STORAGE_KEY,JSON.stringify(s));return s}
}
function migrateState(s){

function recalcChargeStatuses(){
  const now=Date.now();

}
function merchantFinancialStatus(mid){recalcChargeStatuses();const charges=db.charges.filter(c=>c.merchantId===mid);if(charges.some(c=>c.status==='Vencido'))return'overdue';const soon=charges.some(c=>c.status==='Em aberto'&&c.dueTs&&c.dueTs-Date.now()<2*86400000);return soon?'dueSoon':'ok'}

function periodDateText(start,end){return start.toLocaleDateString('pt-BR')+' a '+end.toLocaleDateString('pt-BR')}
function billingCycleInfo(m,ts=Date.now()){
  const d=new Date(ts),y=d.getFullYear(),mo=d.getMonth(),day=d.getDate();
  if(m.billing==='Mensal'){
    const start=new Date(y,mo,1),end=new Date(y,mo+1,0,23,59,59,999),dueDay=monthDayFromBilling(m.billingDay,5),dueMonth=mo+1,due=new Date(y,dueMonth,Math.min(dueDay,monthLastDay(y,dueMonth)),23,59,59,999);
    return{key:`${y}-${String(mo+1).padStart(2,'0')}`,period:periodDateText(start,end),dueTs:due.getTime(),due:due.toLocaleDateString('pt-BR')}
  }
  if(m.billing==='Quinzenal'){
    const first=day<=15;const start=new Date(y,mo,first?1:16,0,0,0,0),end=first?new Date(y,mo,15,23,59,59,999):new Date(y,mo+1,0,23,59,59,999),due=new Date(end);due.setDate(due.getDate()+2);
    return{key:`${y}-${String(mo+1).padStart(2,'0')}-${first?'Q1':'Q2'}`,period:periodDateText(start,end),dueTs:due.getTime(),due:due.toLocaleDateString('pt-BR')}
  }
  const targetDay=billingWeekday(m.billingDay)??1,currentDay=d.getDay(),daysUntil=(targetDay-currentDay+7)%7,end=new Date(y,mo,day+daysUntil,23,59,59,999),start=new Date(end);start.setDate(end.getDate()-6);start.setHours(0,0,0,0);
  return{key:`W-${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,'0')}-${String(start.getDate()).padStart(2,'0')}`,period:periodDateText(start,end),dueTs:end.getTime(),due:end.toLocaleDateString('pt-BR')}
}
function addDeliveryToCharge(d){const m=merchant(d.merchantId),cycle=billingCycleInfo(m,d.finishedAt||Date.now());let c=db.charges.find(x=>x.merchantId===m.id&&x.cycleKey===cycle.key&&x.status!=='Pago');if(!c){c={id:'C-'+Date.now(),merchantId:m.id,cycleKey:cycle.key,period:cycle.period,count:0,total:0,due:cycle.due,dueTs:cycle.dueTs,status:'Em aberto',deliveryIds:[]};db.charges.push(c)}c.deliveryIds=c.deliveryIds||[];if(!c.deliveryIds.includes(d.id)){c.deliveryIds.push(d.id);c.count+=1;c.total=Number((c.total+d.price).toFixed(2))}}

function paymentMethodLabel(method){return({PIX:'PIX',Boleto:'Boleto'}[method]||method||'Pagamento')}
function paymentSubmissionForCharge(chargeId){return(db.paymentSubmissions||[]).find(s=>s.status==='Em análise'&&(s.chargeIds||[]).includes(chargeId))||null}
function paymentCharges(chargeIds,merchantId){const ids=[...new Set((Array.isArray(chargeIds)?chargeIds:[chargeIds]).filter(Boolean))],charges=ids.map(id=>db.charges.find(c=>c.id===id)).filter(Boolean);if(!ids.length||charges.length!==ids.length)return null;if(merchantId&&charges.some(c=>c.merchantId!==merchantId))return null;return charges}
function submitPaymentProof(chargeIds,method,note=''){
  if(!session||session.role!=='merchant'){toast('Apenas o comerciante responsável pode enviar comprovante.','error');return false}
  if(!['PIX','Boleto'].includes(method)){toast('Escolha PIX ou boleto.','error');return false}
  const charges=paymentCharges(chargeIds,session.merchantId);
  if(!charges){toast('Não foi possível localizar as cobranças selecionadas.','error');return false}
  if(charges.some(c=>c.status==='Pago')){toast('Uma das cobranças selecionadas já está paga.','error');return false}
  if(charges.some(c=>paymentSubmissionForCharge(c.id))){toast('Já existe um comprovante em análise para esta cobrança.','error');return false}
  const submittedAt=Date.now(),submission={id:`PG-${submittedAt}-${Math.random().toString(36).slice(2,5)}`,merchantId:session.merchantId,chargeIds:charges.map(c=>c.id),method,total:Number(charges.reduce((sum,c)=>sum+Number(c.total||0),0).toFixed(2)),note:String(note||'').trim().slice(0,500),status:'Em análise',submittedAt,reviewedAt:null,reviewedBy:'',rejectionReason:''};
  db.paymentSubmissions.unshift(submission);
  charges.forEach(c=>{c.paymentProofReference=submission.id;c.paymentProofPendingAt=submittedAt});
  audit(`Comprovante enviado: ${submission.id}`,{merchantId:submission.merchantId,chargeIds:submission.chargeIds,method:submission.method,total:submission.total});
  save();
  return true
}
function settlePaymentSubmission(id){
  if(!session||session.role!=='admin'||(!session.main&&!hasPerm('finance_confirm'))){toast('Seu perfil não pode confirmar pagamentos.','error');return false}
  const submission=(db.paymentSubmissions||[]).find(s=>s.id===id&&s.status==='Em análise');
  if(!submission){toast('Este comprovante não está mais aguardando conferência.','error');return false}
  const charges=paymentCharges(submission.chargeIds,submission.merchantId);
  if(!charges){toast('As cobranças deste comprovante não foram encontradas.','error');return false}
  const paidAt=Date.now();
  charges.forEach(c=>{c.status='Pago';c.paidAt=paidAt;c.paidBy=session.name;c.paymentReference=submission.id;delete c.paymentProofPendingAt});
  submission.status='Confirmado';submission.reviewedAt=paidAt;submission.reviewedBy=session.name;
  audit(`Pagamento confirmado: ${submission.id}`,{merchantId:submission.merchantId,chargeIds:submission.chargeIds,total:submission.total});
  save();
  return true
}
function rejectPaymentSubmission(id,reason=''){
  if(!session||session.role!=='admin'||(!session.main&&!hasPerm('finance_confirm'))){toast('Seu perfil não pode recusar comprovantes.','error');return false}
  const submission=(db.paymentSubmissions||[]).find(s=>s.id===id&&s.status==='Em análise');
  if(!submission)return false;
  const message=String(reason||'').trim();
  if(!message){toast('Informe o motivo da devolução.');return false}

  audit(`Comprovante devolvido: ${submission.id}`,{merchantId:submission.merchantId,reason:submission.rejectionReason});

}
function runBillingAutomation(){
  recalcChargeStatuses();
  db.billingNotifications=db.billingNotifications||[];
  const known=new Set(db.billingNotifications.map(n=>`${n.chargeId}:${n.type}`));
  let changed=false;
  db.charges.filter(c=>c.status!=='Pago').forEach(c=>{
    const diff=(c.dueTs||0)-Date.now(),type=c.status==='Vencido'?'overdue':diff>0&&diff<=2*86400000?'dueSoon':'';

  });

function billingNoticesForMerchant(merchantId){runBillingAutomation();return(db.billingNotifications||[]).filter(n=>{const c=db.charges.find(x=>x.id===n.chargeId);if(!c||c.merchantId!==merchantId||c.status==='Pago')return false;const currentType=c.status==='Vencido'?'overdue':c.dueTs&&c.dueTs-Date.now()>0&&c.dueTs-Date.now()<=2*86400000?'dueSoon':'';return n.type===currentType}).sort((a,b)=>b.createdAt-a.createdAt)}

function normalizeOnlineQueue(){const online=db.couriers.filter(c=>c.online&&!c.adminBlocked).sort((a,b)=>(a.queue||999)-(b.queue||999));online.forEach((c,i)=>c.queue=i+1)}

function engineQueue(reason='Sistema'){
  normalizeOnlineQueue();let changed=false;

  if(changed)save();return changed

function moveCourierToEnd(c){const online=db.couriers.filter(x=>x.online&&!x.adminBlocked&&x.id!==c.id);const max=Math.max(0,...online.map(x=>x.queue||0));c.queue=max+1;normalizeOnlineQueue()}

function pendingCount(){return db.complaints.filter(x=>x.status!=='Resolvida').length+db.addressReviews.filter(x=>x.status==='Pendente').length+db.logoutRequests.filter(x=>x.status==='Pendente').length+db.occurrences.filter(x=>x.status!=='Encerrada').length+db.deliveries.filter(d=>d.status==='Aguardando entregador'&&minutesSince(d.createdAt)>=5).length}

function nudgeCourier(deliveryId){const d=delivery(deliveryId);if(!d||!d.courierId)return;if(d.nudgeCount>=3)return toast('As três cobranças já foram enviadas. Use WhatsApp ou ligação.');d.nudgeCount++;const c=courier(d.courierId);db.internalMessages.push({id:'M-'+Date.now(),courierId:c.id,msg:`ATENÇÃO ${d.nudgeCount}/3: a entrega ${d.id} está aguardando sua ação.`,level:'Urgente',at:Date.now(),read:false,requiresAck:true,readAt:null,deliveryId:d.id});audit(`Cobrança ${d.nudgeCount}/3 enviada para ${c.nick}`,{deliveryId:d.id});if(d.nudgeCount===3)createOccurrence({type:'Sem resposta',severity:'Crítica',deliveryId:d.id,courierId:c.id,merchantId:d.merchantId,title:`Três cobranças sem resposta — ${c.nick}`,description:`A entrega ${d.id} atingiu o limite de três alertas sem ação registrada.`});save();renderAdmin();toast('Cobrança enviada ao entregador.')}
