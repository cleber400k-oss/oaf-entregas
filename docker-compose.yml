services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "8787"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      OAF_DOMAIN: ${OAF_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs/caddy:/var/log/caddy

volumes:
  caddy_data:
  caddy_config:
